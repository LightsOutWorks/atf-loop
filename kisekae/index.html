<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>まじかる☆きせかえ</title>
<style>
:root{
  --pink:#ff8fbf; --pink2:#ff6fa9; --lav:#c9aef2; --cream:#fff8fb;
  --ink:#6b4a63; --card:#ffffff; --panel:rgba(255,255,255,.78);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden}
body{
  position:fixed;inset:0;
  font-family:'Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN W4','BIZ UDGothic','Yu Gothic',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 18%, rgba(255,214,236,.9) 0 8%, transparent 9%),
    radial-gradient(circle at 88% 12%, rgba(214,230,255,.9) 0 6%, transparent 7%),
    radial-gradient(circle at 92% 82%, rgba(255,240,200,.9) 0 7%, transparent 8%),
    radial-gradient(circle at 6% 86%, rgba(220,246,232,.9) 0 6%, transparent 7%),
    linear-gradient(135deg,#ffe9f4 0%,#f3ecff 45%,#e8f4ff 100%);
}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{
  flex:0 0 62px;display:flex;align-items:center;gap:10px;padding:8px 14px 2px;
}
h1{
  font-size:26px;letter-spacing:2px;white-space:nowrap;
  background:linear-gradient(90deg,#ff6fa9,#b487f0 60%,#63b3f2);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.9));
}
#hbtns{margin-left:auto;display:flex;gap:8px}
.hbtn{
  border:0;height:46px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:700;
  font-family:inherit;color:#fff;display:flex;align-items:center;gap:6px;
  background:linear-gradient(180deg,#ffa2c9,#ff6fa9);
  box-shadow:0 4px 0 #e05a92,0 6px 12px rgba(255,110,170,.35);
  transition:transform .08s;
}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #e05a92}
.hbtn.alt{background:linear-gradient(180deg,#c9b2f4,#a583e8);box-shadow:0 4px 0 #8a67ce,0 6px 12px rgba(160,130,230,.35)}
.hbtn.alt:active{box-shadow:0 1px 0 #8a67ce}
main{flex:1;display:flex;gap:12px;padding:8px 14px 14px;min-height:0}
#stageWrap{flex:1.02;display:flex;align-items:center;justify-content:center;min-width:0}
#stageCard{
  height:100%;aspect-ratio:2/3;max-width:100%;border-radius:26px;overflow:hidden;position:relative;
  background:#fff;box-shadow:0 10px 26px rgba(180,120,180,.25),0 0 0 6px rgba(255,255,255,.65);
}
#stage{width:100%;height:100%;display:block}
#panel{
  flex:1.25;min-width:0;display:flex;flex-direction:column;border-radius:26px;overflow:hidden;
  background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 10px 26px rgba(180,120,180,.18),inset 0 0 0 2px rgba(255,255,255,.8);
}
#tabs{
  flex:0 0 78px;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:8px 10px;
  scrollbar-width:none;
}
#tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;min-width:66px;border:0;border-radius:18px;background:rgba(255,255,255,.75);
  font-family:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:6px 8px;box-shadow:0 2px 6px rgba(180,120,180,.14);transition:transform .08s;
}
.tab .ic{font-size:24px;line-height:1}
.tab .lb{font-size:11px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.tab.on{background:linear-gradient(180deg,#ff9cc6,#ff6fa9);color:#fff;box-shadow:0 3px 0 #e05a92}
.tab:active{transform:scale(.94)}
#grid{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 12px 6px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start;-webkit-overflow-scrolling:touch}
.sechead{grid-column:1/-1;font-size:13px;font-weight:800;color:#a06fb0;padding:4px 4px 0;letter-spacing:1px}
.card{
  border:0;border-radius:18px;background:var(--card);padding:6px 4px 6px;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;color:var(--ink);
  box-shadow:0 2px 8px rgba(180,120,180,.15),inset 0 0 0 3px transparent;transition:transform .08s;
}
.card:active{transform:scale(.95)}
.card.on{box-shadow:0 2px 8px rgba(255,110,170,.3),inset 0 0 0 3.5px var(--pink)}
.card.on::after{
  content:'✓';position:absolute;top:-6px;right:-4px;width:26px;height:26px;border-radius:50%;
  background:var(--pink2);color:#fff;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 4px rgba(224,90,146,.5);
}
.card svg{width:100%;height:86px;pointer-events:none}
.card .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;max-width:100%}
.card.noneCard svg{opacity:.9}
#swatches{
  flex:0 0 auto;display:flex;gap:9px;align-items:center;padding:8px 14px 12px;overflow-x:auto;scrollbar-width:none;min-height:26px;
}
#swatches::-webkit-scrollbar{display:none}
#swatches .swlb{font-size:12px;font-weight:800;color:#a06fb0;white-space:nowrap}
.sw{
  flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:0;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.9),0 2px 6px rgba(150,100,150,.3);transition:transform .08s;
}
.sw.on{box-shadow:inset 0 0 0 3px #fff,0 0 0 3.5px var(--pink2),0 2px 6px rgba(150,100,150,.3)}
.sw:active{transform:scale(.9)}
/* doll animation */
.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:220px 600px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.jump{animation:jump .55s cubic-bezier(.3,1.6,.5,1) 1}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-34px)}70%{transform:translateY(3px)}100%{transform:translateY(0)}}
.tw{animation:tw 2.4s ease-in-out infinite}
.tw2{animation:tw 3.1s ease-in-out .9s infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.95;transform:scale(1.15)}}
.burst{animation:burst .6s ease-out 1 forwards}
@keyframes burst{0%{opacity:1;transform:scale(.2)}80%{opacity:.9}100%{opacity:0;transform:scale(1.5)}}
/* overlays */
#rotate{
  position:fixed;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:linear-gradient(135deg,#ffe9f4,#e8f4ff);color:var(--ink);text-align:center;
}
#rotate .big{font-size:64px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
#rotate p{font-size:20px;font-weight:800;letter-spacing:2px}
@media (orientation:portrait){#rotate{display:flex}}
#photoModal{
  position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
  background:rgba(90,50,90,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
#photoModal.show{display:flex}
#photoBox{
  background:#fff;border-radius:24px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;
  max-width:min(78vw,420px);max-height:92vh;box-shadow:0 16px 40px rgba(80,40,90,.4);
}
#photoBox img{max-width:100%;max-height:62vh;border-radius:14px;box-shadow:0 4px 14px rgba(120,80,140,.3)}
#photoBox p{font-size:14px;font-weight:700;text-align:center}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>まじかる☆きせかえ</h1>
    <div id="hbtns">
      <button class="hbtn alt" id="btnShuffle">🎲 おまかせ</button>
      <button class="hbtn alt" id="btnReset">↺ はじめから</button>
      <button class="hbtn" id="btnPhoto">📷 しゃしん</button>
      <button class="hbtn alt" id="btnSound">🔊</button>
    </div>
  </header>
  <main>
    <section id="stageWrap"><div id="stageCard"><svg id="stage" viewBox="0 0 440 660" xmlns="http://www.w3.org/2000/svg"></svg></div></section>
    <aside id="panel">
      <nav id="tabs"></nav>
      <div id="grid"></div>
      <div id="swatches"></div>
    </aside>
  </main>
</div>
<div id="rotate"><div class="big">📱</div><p>iPadを よこむきに してね！</p></div>
<div id="photoModal"><div id="photoBox"><img id="photoImg" alt="きせかえしゃしん"><p id="photoMsg">がぞうを ながおしすると ほぞんできるよ📷</p><button class="hbtn" id="btnCloseModal">とじる</button></div></div>
<script>
'use strict';
/* ================= palettes ================= */
const SKIN=[
 {base:'#ffe4d0',shade:'#f5c6a8',line:'rgba(150,86,80,.35)'},
 {base:'#f3cba2',shade:'#e0ad7c',line:'rgba(140,80,50,.4)'},
 {base:'#c98f5e',shade:'#b1753f',line:'rgba(90,50,25,.45)'}
];
const HAIRC=[
 {a:'#5a3d2e',b:'#7c5843',nm:'ダークブラウン'},
 {a:'#35313d',b:'#565064',nm:'くろ'},
 {a:'#8a512f',b:'#aa7048',nm:'チョコ'},
 {a:'#f0cf8e',b:'#f9e5b4',nm:'きんいろ'},
 {a:'#f2a0c4',b:'#f9c4da',nm:'ピンク'},
 {a:'#b191e2',b:'#cdb4ee',nm:'むらさき'},
 {a:'#8cb2e8',b:'#b0cdf2',nm:'そら'},
 {a:'#8fd4ba',b:'#b6e5d2',nm:'ミント'}
];
const EYEC=['#6b4a35','#4a70b8','#4f9e6e','#9a6fd0','#d4738e'];
const LIPC=[{nm:'さくらピンク',c:'#ff8fb3'},{nm:'いちごレッド',c:'#e8556d'},{nm:'コーラル',c:'#ff9c80'},{nm:'ラベンダー',c:'#c79df0'},{nm:'つやグロス',c:'#ff9fb8'}];
const SHADOWC=[{nm:'ピンク',c:'#ffb0cc'},{nm:'パープル',c:'#cbaaf0'},{nm:'ブルー',c:'#a8cef2'},{nm:'ゴールド',c:'#f2d38a'}];
const CHEEKNM=['ふんわり','まんまる','ハート','ななめ'];
const GEMNM=['おほし','ハート','ダイヤ'];
const MK0={lip:-1,cheek:-1,shadow:-1,lash:0,gem:-1};
const PAL={
 pink:{a:'#ffa8cc',b:'#ff77ad',c:'#fff2f8'},
 lav:{a:'#cbb0f2',b:'#a988e2',c:'#f7f1ff'},
 sky:{a:'#a3d2f5',b:'#6fb1e6',c:'#eef8ff'},
 mint:{a:'#a3dfc6',b:'#6fc9a4',c:'#effaf4'},
 lemon:{a:'#f8df92',b:'#eec45c',c:'#fffbe8'},
 white:{a:'#ffffff',b:'#e6e1f0',c:'#fff'},
 red:{a:'#f57286',b:'#e04b60',c:'#ffeef0'},
 navy:{a:'#5f6fae',b:'#46538e',c:'#e8ecff'},
 black:{a:'#4d4856',b:'#393441',c:'#efeef4'},
 peach:{a:'#ffc5a4',b:'#ff9f70',c:'#fff3ea'},
 rose:{a:'#d9a3ad',b:'#c2848f',c:'#f7e9ec'},
 sage:{a:'#adc4a5',b:'#8ba883',c:'#eef4ec'},
 beige:{a:'#dcc8ab',b:'#c2a983',c:'#f8f2e8'},
 bordeaux:{a:'#9e5266',b:'#7d3a4d',c:'#f2e4e8'},
 greige:{a:'#c5bcb4',b:'#a89e94',c:'#f4f1ee'}
};
const P6=[PAL.pink,PAL.lav,PAL.sky,PAL.mint,PAL.lemon,PAL.red];
const P6W=[PAL.white,PAL.pink,PAL.lav,PAL.sky,PAL.navy,PAL.black];
/* ================= svg helpers ================= */
const TAU=Math.PI*2;
const O='stroke="rgba(120,66,96,.30)" stroke-width="2.5" stroke-linejoin="round"';
function star(cx,cy,r,fill,rot){
  rot=rot||0;let p='';
  for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;
    p+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1);}
  return '<path d="'+p+'Z" fill="'+fill+'"/>';
}
function heart(cx,cy,s,fill){
  return '<path d="M'+cx+','+(cy+s*.9)+' C'+(cx-s*1.5)+','+(cy-s*.2)+' '+(cx-s*.75)+','+(cy-s*1.05)+' '+cx+','+(cy-s*.3)+
  ' C'+(cx+s*.75)+','+(cy-s*1.05)+' '+(cx+s*1.5)+','+(cy-s*.2)+' '+cx+','+(cy+s*.9)+'Z" fill="'+fill+'"/>';
}
function bow(cx,cy,s,f1,f2){
  const lx=(cx-s*.95).toFixed(1),rx=(cx+s*.95).toFixed(1);
  return '<ellipse cx="'+lx+'" cy="'+cy+'" rx="'+(s*.95)+'" ry="'+(s*.62)+'" fill="'+f1+'" transform="rotate(-16 '+lx+' '+cy+')"/>'+
  '<ellipse cx="'+rx+'" cy="'+cy+'" rx="'+(s*.95)+'" ry="'+(s*.62)+'" fill="'+f1+'" transform="rotate(16 '+rx+' '+cy+')"/>'+
  '<circle cx="'+cx+'" cy="'+cy+'" r="'+(s*.45)+'" fill="'+f2+'"/>';
}
function scal(x0,x1,y,n,r){
  const w=(x1-x0)/n;let d='M'+x0+','+y;
  for(let i=0;i<n;i++)d+=' q'+(w/2).toFixed(1)+','+r+' '+w.toFixed(1)+',0';
  return d;
}
function MIR(inner){return '<g transform="translate(440,0) scale(-1,1)">'+inner+'</g>';}
/* ================= doll base ================= */
const LEGT='transform="translate(0,342) scale(1,0.96) translate(0,-342)"';
function drawBody(s){
  const k=SKIN[s.skin];
  const armL='<path d="M184,258 C168,272 158,298 153,330 C151,344 149,352 150,357" stroke="'+k.base+'" stroke-width="17" stroke-linecap="round" fill="none"/>'+
    '<circle cx="150" cy="362" r="10.5" fill="'+k.base+'"/>';
  const legL='<path d="M205,342 C203,392 202,470 202,538" stroke="'+k.base+'" stroke-width="22" stroke-linecap="round" fill="none"/>'+
    '<ellipse cx="201" cy="553" rx="15" ry="9.5" fill="'+k.base+'"/>';
  return '<g>'+
   /* legs */ '<g '+LEGT+'>'+legL+MIR(legL)+'</g>'+
   /* torso */ '<path d="M180,250 C180,246 260,246 260,250 C260,288 252,316 246,334 C241,349 199,349 194,334 C188,316 180,288 180,250 Z" fill="'+k.base+'"/>'+
   /* arms */ armL+MIR(armL)+
   /* neck */ '<path d="M208,218 h24 v34 h-24 Z" fill="'+k.base+'"/><path d="M208,222 q12,10 24,0 v8 q-12,8 -24,0 Z" fill="'+k.shade+'" opacity=".3"/>'+
   /* head */ '<path d="M149,140 C149,82 180,54 220,54 C260,54 291,82 291,140 C293,186 268,228 220,233 C172,228 147,186 149,140 Z" fill="'+k.base+'"/>'+
   /* base underwear (paper-doll cami + bloomer) */
   '<path d="M186,262 C186,258 254,258 254,262 C254,292 250,314 245,330 C241,342 199,342 195,330 C190,314 186,292 186,262 Z" fill="#ffffff" opacity=".96"/>'+
   '<path d="'+scal(191,249,334,5,5)+'" stroke="#f3d7ea" stroke-width="3" fill="none"/>'+
   '<path d="M194,336 C194,332 246,332 246,336 L248,362 C248,372 232,374 230,366 L226,352 L214,352 L210,366 C208,374 192,372 192,362 Z" fill="#ffffff" opacity=".96"/>'+
  '</g>';
}
function drawFace(s){
  const k=SKIN[s.skin],ec=EYEC[s.eye],ex=s.expr,mk=s.mk||MK0;
  const lip=mk.lip>=0?LIPC[mk.lip]:null;
  const mouthCol=lip?lip.c:'#b0525e';
  function shadowArc(cx){const sc=SHADOWC[mk.shadow].c;
    return '<path d="M'+(cx-15)+',157 Q'+cx+',139 '+(cx+15)+',157 Q'+cx+',147 '+(cx-15)+',157 Z" fill="'+sc+'" opacity=".75"/>';}
  function lashX(cx,dir){
    return '<path d="M'+(cx+dir*15)+',159 l'+(dir*8)+',-5 M'+(cx+dir*14)+',166 l'+(dir*9)+',-1" stroke="#4a3040" stroke-width="3" stroke-linecap="round" fill="none"/>';}
  function openEye(cx,dir){
    let e='';
    if(mk.shadow>=0)e+=shadowArc(cx);
    e+='<ellipse cx="'+cx+'" cy="169" rx="14.8" ry="17.8" fill="#fff"/>'+
    '<circle cx="'+cx+'" cy="170" r="12.2" fill="'+ec+'"/>'+
    '<circle cx="'+cx+'" cy="173" r="6.6" fill="#2c2033"/>'+
    '<circle cx="'+(cx-4.5)+'" cy="162" r="4.4" fill="#fff"/>'+
    '<circle cx="'+(cx+5)+'" cy="175" r="2.3" fill="#fff" opacity=".9"/>'+
    '<path d="M'+(cx-14.5)+',164 Q'+cx+',150.5 '+(cx+14.5)+',164" stroke="#4a3040" stroke-width="5" stroke-linecap="round" fill="none"/>';
    if(mk.lash===1)e+=lashX(cx,dir);
    return e;
  }
  function closedEye(cx,dir){
    let e='';
    if(mk.shadow>=0)e+=shadowArc(cx);
    e+='<path d="M'+(cx-13)+',171 Q'+cx+',158 '+(cx+13)+',171" stroke="#4a3040" stroke-width="4.5" stroke-linecap="round" fill="none"/>';
    if(mk.lash===1)e+=lashX(cx,dir);
    return e;
  }
  let eyes='';
  if(ex===1){eyes=closedEye(190,-1)+closedEye(250,1);}
  else if(ex===2){eyes=openEye(190,-1)+closedEye(250,1)+star(272,152,7,'#f7c948');}
  else{eyes=openEye(190,-1)+openEye(250,1);}
  let cheeks='';
  if(mk.cheek===0){cheeks='<ellipse cx="170" cy="192" rx="13.5" ry="8" fill="#ff8fa0" opacity=".5"/><ellipse cx="270" cy="192" rx="13.5" ry="8" fill="#ff8fa0" opacity=".5"/>';}
  else if(mk.cheek===1){cheeks='<circle cx="170" cy="192" r="9.5" fill="#ff8fa0" opacity=".62"/><circle cx="270" cy="192" r="9.5" fill="#ff8fa0" opacity=".62"/><circle cx="167" cy="189" r="3" fill="#fff" opacity=".65"/><circle cx="267" cy="189" r="3" fill="#fff" opacity=".65"/>';}
  else if(mk.cheek===2){cheeks=heart(170,192,8,'rgba(255,120,150,.6)')+heart(270,192,8,'rgba(255,120,150,.6)');}
  else if(mk.cheek===3){cheeks='<path d="M162,187 l8,9 M170,186 l8,9 M178,185 l8,9" stroke="#ff8fa0" stroke-width="3.5" stroke-linecap="round" opacity=".7"/><path d="M254,185 l8,9 M262,186 l8,9 M270,187 l8,9" stroke="#ff8fa0" stroke-width="3.5" stroke-linecap="round" opacity=".7"/>';}
  else{cheeks='<ellipse cx="170" cy="191" rx="10.5" ry="6.5" fill="#ff9d94" opacity=".45"/><ellipse cx="270" cy="191" rx="10.5" ry="6.5" fill="#ff9d94" opacity=".45"/>';}
  let mouth='';
  if(ex===1||ex===2){
    mouth='<path d="M204,202 Q220,226 236,202 Q220,212 204,202 Z" fill="#d95f6b"/><path d="M211,209 Q220,217 229,209 L227,213 Q220,218 213,213 Z" fill="#f2949c"/>';
    if(lip)mouth+='<path d="M204,202 Q220,214 236,202" stroke="'+lip.c+'" stroke-width="3.5" stroke-linecap="round" fill="none" opacity=".9"/>';
  }
  else if(ex===3){mouth='<path d="M211,207 Q220,211 229,207" stroke="'+mouthCol+'" stroke-width="4" stroke-linecap="round" fill="none"/>';}
  else{mouth='<path d="M208,202 Q220,214 232,202" stroke="'+mouthCol+'" stroke-width="'+(lip?5.5:4.5)+'" stroke-linecap="round" fill="none"/>';}
  if(lip&&ex!==1&&ex!==2)mouth+='<ellipse cx="224" cy="207" rx="3.5" ry="2" fill="#fff" opacity=".7"/>';
  let gems='';
  if(mk.gem===0)gems=star(173,184,5.5,'#f2c94c')+star(267,184,5.5,'#f2c94c');
  else if(mk.gem===1)gems=heart(173,184,5,'#ff85a8')+heart(267,184,5,'#ff85a8');
  else if(mk.gem===2)gems='<path d="M173,178 l5,6 -5,6 -5,-6 Z" fill="#8fd0f0"/><path d="M267,178 l5,6 -5,6 -5,-6 Z" fill="#8fd0f0"/>';
  return '<g>'+eyes+
   '<path d="M217,187 q3,4 6,0" stroke="'+k.shade+'" stroke-width="2.5" stroke-linecap="round" fill="none"/>'+
   cheeks+mouth+gems+'</g>';
}
/* ================= hair ================= */
const HAIR=[
 {nm:'いつものロング',
  back:h=>'<path d="M220,46 C148,46 120,104 126,186 C130,252 112,318 124,378 C128,398 144,404 152,390 C158,378 162,366 170,362 C176,390 190,400 198,384 L242,384 C250,400 264,390 270,362 C278,366 282,378 288,390 C296,404 312,398 316,378 C328,318 310,252 314,186 C320,104 292,46 220,46 Z" fill="'+h.a+'"/>'+

  '<g fill="#ffd98a"><circle cx="40" cy="52" r="4"/><circle cx="100" cy="57" r="4"/><circle cx="160" cy="37" r="4"/><circle cx="220" cy="40" r="4"/><circle cx="280" cy="51" r="4"/><circle cx="340" cy="45" r="4"/><circle cx="400" cy="36" r="4"/></g>'}
];
/* mature dusty-color additions to existing favorites */
[DRESS[0],DRESS[5],TOP[0],TOP[1],TOP[4],TOP[5],BOTTOM[0],BOTTOM[1],SHOES[0],SHOES[1],HEADACC[1],NECK[0]].forEach(function(it){it.pals.push(PAL.rose,PAL.beige);});
[DRESS[1],BOTTOM[2],HEADACC[0]].forEach(function(it){it.pals.push(PAL.bordeaux);});
/* ================= registry ================= */
const DB={
 hair:{lb:'かみがた',ic:'🎀',items:HAIR,crop:'90 10 260 300',opt:false},
 face:{lb:'おかお',ic:'😊',special:'face'},
 makeup:{lb:'おけしょう',ic:'💄',special:'makeup'},
 dress:{lb:'ドレス',ic:'👗',items:DRESS,crop:'100 220 240 320',opt:true},
 top:{lb:'トップス',ic:'👚',items:TOP,crop:'120 225 200 150',opt:true},
 bottom:{lb:'スカート',ic:'🌸',items:BOTTOM,crop:'110 300 220 180',opt:true},
 socks:{lb:'くつした',ic:'🧦',items:SOCKS,crop:'150 408 140 146',opt:true},
 shoes:{lb:'くつ',ic:'👟',items:SHOES,crop:'140 452 160 114',opt:true},
 head:{lb:'あたま',ic:'👑',items:HEADACC,crop:'110 0 220 140',opt:true},
 faceacc:{lb:'かおアクセ',ic:'👓',items:FACEACC,crop:'140 110 160 110',opt:true},
 neck:{lb:'くび',ic:'📿',items:NECK,crop:'160 230 120 70',opt:true},
 wings:{lb:'はね',ic:'🦋',items:WINGS,crop:'40 180 360 240',opt:true},
 hand:{lb:'てにもつ',ic:'🪄',items:HAND,crop:'80 250 200 200',opt:true},
 bg:{lb:'はいけい',ic:'🏰',items:BG,crop:'0 0 440 660',opt:false}
};
const SLOT_ORDER=['hair','face','makeup','dress','top','bottom','socks','shoes','head','faceacc','neck','wings','hand','bg'];
/* ================= state ================= */
const DEFAULT_STATE={
 skin:0,eye:0,expr:0,hairC:0,
 mk:{lip:-1,cheek:-1,shadow:-1,lash:0,gem:-1},
 hair:{i:0,c:0},dress:{i:-1,c:0},top:{i:1,c:0},bottom:{i:3,c:0},
 socks:{i:-1,c:0},shoes:{i:-1,c:0},head:{i:-1,c:0},faceacc:{i:-1,c:0},
 neck:{i:-1,c:0},wings:{i:-1,c:0},hand:{i:-1,c:0},bg:{i:0,c:0}
};
let S=load()||JSON.parse(JSON.stringify(DEFAULT_STATE));
let curTab='hair';
function load(){
 try{const r=localStorage.getItem('kisekae-v2');if(!r)return null;
  const s=JSON.parse(r);if(typeof s.skin!=='number'||!s.hair)return null;
  if(!s.mk)s.mk=JSON.parse(JSON.stringify(MK0));
  if(s.hair.i>=HAIR.length||s.hair.i<0)s.hair.i=0;
  return s;}catch(e){return null;}
}
function save(){try{localStorage.setItem('kisekae-v2',JSON.stringify(S));}catch(e){}}
/* ================= render ================= */
function itemOf(slot){const d=DB[slot];if(!d||!d.items)return null;const st=S[slot];if(st.i<0)return null;return d.items[st.i];}
function colOf(slot){const it=itemOf(slot);if(!it||!it.pals)return null;return it.pals[Math.min(S[slot].c,it.pals.length-1)];}
function drawDoll(){
 const h=HAIRC[S.hairC];
 const hair=HAIR[S.hair.i]||HAIR[0];
 let g='';
 const w=itemOf('wings');if(w)g+=w.d(colOf('wings'));
 g+='<g>'+hair.back(h)+'</g>';
 g+=drawBody(S);
 const so=itemOf('socks');if(so)g+='<g '+LEGT+'>'+so.d(colOf('socks'))+'</g>';
 const sh=itemOf('shoes');if(sh)g+='<g '+LEGT+'>'+sh.d(colOf('shoes'))+'</g>';
 const bo=itemOf('bottom');if(bo)g+=bo.d(colOf('bottom'));
 const to=itemOf('top');if(to)g+=to.d(colOf('top'));
 const dr=itemOf('dress');if(dr)g+=dr.d(colOf('dress'));
 const ne=itemOf('neck');if(ne)g+=ne.d(colOf('neck'));
 g+=drawFace(S);
 g+='<g>'+hair.front(h)+'</g>';
 const he=itemOf('head');if(he)g+=he.d(colOf('head'));
 const fa=itemOf('faceacc');if(fa)g+=fa.d(colOf('faceacc'));
 const ha=itemOf('hand');if(ha)g+=ha.d(colOf('hand'));
 return g;
}
function stageInner(withSpark){
 const bg=BG[S.bg.i]||BG[0];
 let s='<g>'+bg.d()+'</g>';
 s+='<ellipse cx="220" cy="586" rx="86" ry="13" fill="rgba(120,80,140,.16)"/>';
 s+='<g id="dollG" class="bob">'+drawDoll()+'</g>';
 if(withSpark){
  s+='<g pointer-events="none">'+
   '<g class="tw" style="transform-origin:70px 300px">'+star(70,300,9,'rgba(255,255,255,.9)')+'</g>'+
   '<g class="tw2" style="transform-origin:376px 250px">'+star(376,250,8,'rgba(255,240,170,.9)')+'</g>'+
   '<g class="tw" style="transform-origin:390px 470px;animation-delay:.6s">'+star(390,470,7,'rgba(255,200,230,.9)')+'</g>'+
   '<g class="tw2" style="transform-origin:56px 500px;animation-delay:1.4s">'+star(56,500,8,'rgba(200,230,255,.95)')+'</g>'+
  '</g>';
 }
 return s;
}
const stageEl=document.getElementById('stage');
function renderStage(){stageEl.innerHTML=stageInner(true);}
/* thumbnails: doll preview with slot item applied, cropped */
function thumbSVG(slot,idx){
 const saved=JSON.parse(JSON.stringify(S));
 S[slot]={i:idx,c:S[slot].i===idx?S[slot].c:0};
 if(slot==='dress'&&idx>=0){S.top={i:-1,c:0};S.bottom={i:-1,c:0};}
 if((slot==='top'||slot==='bottom')&&idx>=0){S.dress={i:-1,c:0};}
 let inner;
 if(slot==='bg'){inner='<g>'+BG[idx].d()+'</g>';}
 else{inner=drawDoll();}
 const crop=DB[slot].crop;
 S=saved;
 return '<svg viewBox="'+crop+'" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>';
}
/* ================= UI ================= */
const tabsEl=document.getElementById('tabs'),gridEl=document.getElementById('grid'),swEl=document.getElementById('swatches');
function buildTabs(){
 tabsEl.innerHTML=SLOT_ORDER.map(k=>{
  const d=DB[k];
  return '<button class="tab'+(k===curTab?' on':'')+'" data-tab="'+k+'"><span class="ic">'+d.ic+'</span><span class="lb">'+d.lb+'</span></button>';
 }).join('');
}
function noneCard(slot){
 const on=S[slot].i<0?' on':'';
 return '<button class="card noneCard'+on+'" data-slot="'+slot+'" data-idx="-1">'+
  '<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="22" fill="none" stroke="#d9c2d9" stroke-width="4" stroke-dasharray="7 6"/><path d="M20,40 L40,20" stroke="#d9c2d9" stroke-width="4" stroke-linecap="round"/></svg>'+
  '<span class="nm">なし</span></button>';
}
function buildGrid(){
 const d=DB[curTab];
 if(d.special==='face'){buildFaceGrid();return;}
 if(d.special==='makeup'){buildMakeupGrid();return;}
 let html='';
 if(d.opt)html+=noneCard(curTab);
 d.items.forEach((it,i)=>{
  const on=S[curTab].i===i?' on':'';
  html+='<button class="card'+on+'" data-slot="'+curTab+'" data-idx="'+i+'">'+thumbSVG(curTab,i)+'<span class="nm">'+it.nm+'</span></button>';
 });
 gridEl.innerHTML=html;
 buildSwatches();
}
function faceThumb(vb){
 return '<svg viewBox="'+vb+'">'+'<g>'+HAIR[S.hair.i].back(HAIRC[S.hairC])+'</g>'+drawBody(S)+drawFace(S)+'<g>'+HAIR[S.hair.i].front(HAIRC[S.hairC])+'</g>'+'</svg>';
}
function buildFaceGrid(){
 let html='<div class="sechead">ひょうじょう</div>';
 const exNames=['にこにこ','わーい','ウインク','おすまし'];
 for(let i=0;i<4;i++){
  const saved=S.expr;S.expr=i;
  html+='<button class="card'+(saved===i?' on':'')+'" data-expr="'+i+'">'+faceThumb('145 100 150 130')+'<span class="nm">'+exNames[i]+'</span></button>';
  S.expr=saved;
 }
 html+='<div class="sechead">おはだ</div>';
 SKIN.forEach((k,i)=>{
  html+='<button class="card'+(S.skin===i?' on':'')+'" data-skin="'+i+'">'+
   '<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="24" fill="'+k.base+'"/><circle cx="22" cy="34" r="5" fill="#ff9d94" opacity=".5"/><circle cx="38" cy="34" r="5" fill="#ff9d94" opacity=".5"/></svg>'+
   '<span class="nm">'+['ライト','タン','ブラウン'][i]+'</span></button>';
 });
 html+='<div class="sechead">おめめのいろ</div>';
 EYEC.forEach((e,i)=>{
  html+='<button class="card'+(S.eye===i?' on':'')+'" data-eye="'+i+'">'+
   '<svg viewBox="0 0 60 60"><ellipse cx="30" cy="30" rx="16" ry="19" fill="#fff" stroke="#4a3040" stroke-width="3"/><circle cx="30" cy="31" r="11" fill="'+e+'"/><circle cx="30" cy="34" r="6" fill="#2c2033"/><circle cx="26" cy="26" r="4" fill="#fff"/></svg>'+
   '<span class="nm">'+['ブラウン','ブルー','グリーン','パープル','ピンク'][i]+'</span></button>';
 });
 gridEl.innerHTML=html;
 swEl.innerHTML='';
}
function buildMakeupGrid(){
 let html='';
 function sec(title,key,names,count,noneLb,vb,extraNone){
  html+='<div class="sechead">'+title+'</div>';
  const cur=S.mk[key];
  if(noneLb!==null){
   const saved=S.mk[key];S.mk[key]=extraNone!==undefined?extraNone:-1;
   const onN=(cur===(extraNone!==undefined?extraNone:-1))?' on':'';
   html+='<button class="card'+onN+'" data-mk="'+key+'" data-mi="'+(extraNone!==undefined?extraNone:-1)+'">'+faceThumb(vb)+'<span class="nm">'+noneLb+'</span></button>';
   S.mk[key]=saved;
  }
  for(let i=0;i<count;i++){
   const saved=S.mk[key];S.mk[key]=i;
   html+='<button class="card'+(cur===i?' on':'')+'" data-mk="'+key+'" data-mi="'+i+'">'+faceThumb(vb)+'<span class="nm">'+names[i]+'</span></button>';
   S.mk[key]=saved;
  }
 }
 sec('💋 リップ','lip',LIPC.map(l=>l.nm),LIPC.length,'なし','160 168 120 70');
 sec('🍑 チーク','cheek',CHEEKNM,4,'ナチュラル','148 150 144 76');
 sec('✨ アイシャドウ','shadow',SHADOWC.map(x=>x.nm),SHADOWC.length,'なし','150 122 140 82');
 html+='<div class="sechead">👁 まつげ</div>';
 const curLash=S.mk.lash;
 [['ふつう',0],['ロングまつげ',1]].forEach(p=>{
  S.mk.lash=p[1];
  html+='<button class="card'+(curLash===p[1]?' on':'')+'" data-mk="lash" data-mi="'+p[1]+'">'+faceThumb('150 122 140 82')+'<span class="nm">'+p[0]+'</span></button>';
 });
 S.mk.lash=curLash;
 sec('💎 キラキラ','gem',GEMNM,3,'なし','148 148 144 66');
 gridEl.innerHTML=html;
 swEl.innerHTML='';
}
function buildSwatches(){
 const d=DB[curTab];
 if(curTab==='hair'){
  swEl.innerHTML='<span class="swlb">かみのいろ▶</span>'+HAIRC.map((h,i)=>
   '<button class="sw'+(S.hairC===i?' on':'')+'" data-hairc="'+i+'" style="background:linear-gradient(135deg,'+h.b+','+h.a+')"></button>').join('');
  return;
 }
 const it=itemOf(curTab);
 if(!it||!it.pals){swEl.innerHTML='';return;}
 swEl.innerHTML='<span class="swlb">いろ▶</span>'+it.pals.map((p,i)=>
  '<button class="sw'+(S[curTab].c===i?' on':'')+'" data-col="'+i+'" style="background:linear-gradient(135deg,'+p.a+','+p.b+')"></button>').join('');
}
function refresh(){renderStage();buildGrid();save();}
/* ================= sound ================= */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f0,f1,t,dur,type,vol){
 const a=ac();if(!a||muted)return;
 const o=a.createOscillator(),g=a.createGain();
 o.type=type||'sine';o.frequency.setValueAtTime(f0,a.currentTime+t);
 o.frequency.exponentialRampToValueAtTime(f1,a.currentTime+t+dur);
 g.gain.setValueAtTime(0.0001,a.currentTime+t);
 g.gain.exponentialRampToValueAtTime(vol||0.12,a.currentTime+t+0.015);
 g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t+dur);
 o.connect(g).connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+dur+0.02);
}
const sndPop=()=>tone(620,980,0,0.09);
const sndSwatch=()=>tone(880,1180,0,0.07,'sine',0.09);
const sndShuffle=()=>{tone(523,523,0,0.09);tone(659,659,0.08,0.09);tone(784,784,0.16,0.12);tone(1046,1046,0.24,0.16,'sine',0.14);};
const sndCam=()=>{tone(1200,600,0,0.05,'square',0.06);tone(1500,900,0.06,0.05,'square',0.06);};
/* ================= sparkle burst ================= */
function burst(){
 const g=document.createElementNS('http://www.w3.org/2000/svg','g');
 g.setAttribute('class','burst');g.setAttribute('pointer-events','none');
 g.style.transformOrigin='220px 320px';
 let inner='';
 for(let i=0;i<8;i++){const a=i*TAU/8,r=95;
  inner+=star(220+r*Math.cos(a),320+r*Math.sin(a),i%2?8:11,i%2?'#ffd9f2':'#fff0a8');}
 g.innerHTML=inner;
 stageEl.appendChild(g);
 setTimeout(()=>{try{stageEl.removeChild(g);}catch(e){}},650);
}
/* ================= actions ================= */
function pick(slot,idx){
 if(S[slot].i===idx&&DB[slot].opt&&idx>=0){/* keep */}
 S[slot]={i:idx,c:(S[slot].i===idx?S[slot].c:0)};
 if(slot==='dress'&&idx>=0){S.top={i:-1,c:0};S.bottom={i:-1,c:0};}
 if((slot==='top'||slot==='bottom')&&idx>=0){S.dress={i:-1,c:0};}
 sndPop();burst();refresh();
}
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(){
 S.hair={i:rnd(HAIR.length),c:0};
 S.hairC=rnd(HAIRC.length);
 S.expr=rnd(4);S.eye=rnd(EYEC.length);
 if(Math.random()<0.55){
  const i=rnd(DRESS.length);S.dress={i:i,c:rnd(DRESS[i].pals.length)};S.top={i:-1,c:0};S.bottom={i:-1,c:0};
 }else{
  const t=rnd(TOP.length),b=rnd(BOTTOM.length);
  S.dress={i:-1,c:0};S.top={i:t,c:rnd(TOP[t].pals.length)};S.bottom={i:b,c:rnd(BOTTOM[b].pals.length)};
 }
 const opt=(slot,arr,p)=>{ if(Math.random()<p){const i=rnd(arr.length);S[slot]={i:i,c:rnd(arr[i].pals.length)};}else S[slot]={i:-1,c:0};};
 opt('socks',SOCKS,0.6);
 {const i=rnd(SHOES.length);S.shoes={i:i,c:rnd(SHOES[i].pals.length)};}
 opt('head',HEADACC,0.7);opt('faceacc',FACEACC,0.3);opt('neck',NECK,0.5);
 opt('wings',WINGS,0.35);opt('hand',HAND,0.55);
 S.mk={
  lip:Math.random()<0.5?rnd(LIPC.length):-1,
  cheek:Math.random()<0.5?rnd(4):-1,
  shadow:Math.random()<0.4?rnd(SHADOWC.length):-1,
  lash:Math.random()<0.4?1:0,
  gem:Math.random()<0.3?rnd(3):-1
 };
 S.bg={i:rnd(BG.length),c:0};
 sndShuffle();burst();refresh();
}
function resetAll(){S=JSON.parse(JSON.stringify(DEFAULT_STATE));sndPop();refresh();}
function takePhoto(){
 sndCam();
 const svgStr='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 660" width="880" height="1320">'+stageInner(false)+'</svg>';
 const blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const img=new Image();
 img.onload=function(){
  try{
   const cv=document.createElement('canvas');cv.width=880;cv.height=1320;
   const cx=cv.getContext('2d');cx.drawImage(img,0,0,880,1320);
   document.getElementById('photoImg').src=cv.toDataURL('image/png');
   document.getElementById('photoMsg').textContent='がぞうを ながおしすると ほぞんできるよ📷';
  }catch(e){
   document.getElementById('photoImg').src=url;
   document.getElementById('photoMsg').textContent='スクリーンショットで ほぞんしてね📷';
  }
  document.getElementById('photoModal').classList.add('show');
 };
 img.onerror=function(){document.getElementById('photoMsg').textContent='ごめんね、しゃしんが つくれなかった…スクリーンショットしてね';document.getElementById('photoModal').classList.add('show');};
 img.src=url;
}
/* ================= events ================= */
tabsEl.addEventListener('click',e=>{
 const b=e.target.closest('.tab');if(!b)return;
 curTab=b.dataset.tab;sndSwatch();buildTabs();buildGrid();
 gridEl.scrollTop=0;
});
gridEl.addEventListener('click',e=>{
 const b=e.target.closest('.card');if(!b)return;
 if(b.dataset.slot){pick(b.dataset.slot,parseInt(b.dataset.idx,10));}
 else if(b.dataset.mk!==undefined){S.mk[b.dataset.mk]=parseInt(b.dataset.mi,10);sndPop();burst();refresh();}
 else if(b.dataset.expr!==undefined){S.expr=+b.dataset.expr;sndPop();refresh();}
 else if(b.dataset.skin!==undefined){S.skin=+b.dataset.skin;sndPop();refresh();}
 else if(b.dataset.eye!==undefined){S.eye=+b.dataset.eye;sndPop();refresh();}
});
swEl.addEventListener('click',e=>{
 const b=e.target.closest('.sw');if(!b)return;
 if(b.dataset.hairc!==undefined){S.hairC=+b.dataset.hairc;}
 else if(b.dataset.col!==undefined){S[curTab].c=+b.dataset.col;}
 sndSwatch();renderStage();buildGrid();save();
});
document.getElementById('btnShuffle').addEventListener('click',shuffle);
document.getElementById('btnReset').addEventListener('click',resetAll);
document.getElementById('btnPhoto').addEventListener('click',takePhoto);
document.getElementById('btnCloseModal').addEventListener('click',()=>document.getElementById('photoModal').classList.remove('show'));
document.getElementById('btnSound').addEventListener('click',function(){muted=!muted;this.textContent=muted?'🔇':'🔊';if(!muted)sndPop();});
stageEl.addEventListener('click',e=>{
 const doll=document.getElementById('dollG');if(!doll)return;
 doll.classList.remove('bob');doll.classList.add('jump');
 tone(700,1400,0,0.18,'sine',0.1);burst();
 setTimeout(()=>{doll.classList.remove('jump');doll.classList.add('bob');},600);
});
document.addEventListener('touchstart',function once(){ac();document.removeEventListener('touchstart',once);},{passive:true});
document.addEventListener('gesturestart',e=>e.preventDefault());
/* ================= boot ================= */
buildTabs();refresh();
</script>
