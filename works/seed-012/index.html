<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RECOIL BALANCE</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0a0c12;
    font-family: sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #stage { position: relative; width: 100vw; height: 100vh; }
  canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; display: block;
    touch-action: none; background: #0a0c12; cursor: crosshair;
  }
  #hud {
    position: absolute; top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between;
    padding: 14px 20px; pointer-events: none;
    font-family: monospace; color: #d9e6ff; font-size: 18px;
    letter-spacing: 1px; text-shadow: 0 0 6px rgba(0,0,0,.7);
  }
  #hud span { color: #ff9f5f; }
  #titleScreen, #overScreen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: rgba(6,7,12,0.82); text-align: center; padding: 24px;
  }
  #overScreen { display: none; }
  h1 {
    font-family: sans-serif; font-size: clamp(26px, 6vw, 46px);
    color: #f2f6ff; letter-spacing: 3px; margin: 0;
  }
  h2 {
    font-family: sans-serif; font-size: clamp(22px, 5vw, 34px);
    color: #f2f6ff; letter-spacing: 2px; margin: 0;
  }
  .sub {
    font-family: sans-serif; color: #a9b6cf; max-width: 520px;
    font-size: 15px; line-height: 1.55; margin: 0;
  }
  .stat { font-family: monospace; color: #ff9f5f; font-size: 17px; margin: 0; }
  button {
    font-family: monospace; font-size: 18px; padding: 13px 34px;
    border-radius: 10px; border: 2px solid #ff9f5f; background: #1a1206;
    color: #fff3e6; cursor: pointer; letter-spacing: 2px; margin-top: 6px;
  }
  button:active { transform: scale(0.96); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div>SCORE <span id="scoreVal">0</span></div>
    <div>DRIFT <span id="driftVal">0%</span></div>
    <div>TIME <span id="timeVal">60</span></div>
  </div>

  <div id="titleScreen">
    <h1>RECOIL BALANCE</h1>
    <p class="sub" id="subDesc">Tap to fire at your reticle — each shot kicks it off-target, and firing again before it settles only compounds the drift.</p>
    <button id="startBtn" type="button">START</button>
  </div>

  <div id="overScreen">
    <h2>TIME UP</h2>
    <p class="stat" id="finalScore">SCORE 0</p>
    <p class="stat" id="finalBest">BEST STREAK 0</p>
    <button id="replayBtn" type="button">REPLAY</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var titleScreen = document.getElementById('titleScreen');
  var overScreen = document.getElementById('overScreen');
  var scoreVal = document.getElementById('scoreVal');
  var driftVal = document.getElementById('driftVal');
  var timeVal = document.getElementById('timeVal');
  var startBtn = document.getElementById('startBtn');
  var replayBtn = document.getElementById('replayBtn');
  var finalScore = document.getElementById('finalScore');
  var finalBest = document.getElementById('finalBest');

  var VIEW_W = 960, VIEW_H = 600;
  var DPR = 1;

  var state = 'title';
  var score = 0;
  var timeLeft = 60;
  var streak = 0;
  var bestStreak = 0;
  var hitCount = 0;
  var lastFrameTime = null;
  var spawnAccum = 0;
  var resultGuardUntil = 0;

  var targets = [];
  var particles = [];
  var pops = [];
  var flashes = [];

  var basePointer = { x: VIEW_W / 2, y: VIEW_H / 2 };
  var recoil = { x: 0, y: 0 };

  var MAX_TARGETS = 7;
  var SPAWN_INTERVAL = 0.55;
  var TARGET_R_MIN = 26, TARGET_R_MAX = 34;
  var TARGET_LIFE_MIN = 2.4, TARGET_LIFE_MAX = 3.4;
  var HIT_PAD = 8;

  var MAX_RECOIL = 150;
  var KICK_MAG = 34;
  var RECOVERY_RATE = 2.6;
  var KEY_SPEED = 420;

  function rand(min, max) { return min + Math.random() * (max - min); }
  function clamp(v, min, max) { return v < min ? min : (v > max ? max : v); }

  function resize() {
    var w = (typeof window.innerWidth === 'number' && window.innerWidth > 0) ? window.innerWidth : VIEW_W;
    var h = (typeof window.innerHeight === 'number' && window.innerHeight > 0) ? window.innerHeight : VIEW_H;
    VIEW_W = w; VIEW_H = h;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.floor(w * DPR));
    canvas.height = Math.max(1, Math.floor(h * DPR));
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    if (typeof ctx.setTransform === 'function') {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    basePointer.x = clamp(basePointer.x, 0, VIEW_W);
    basePointer.y = clamp(basePointer.y, 0, VIEW_H);
  }
  resize();
  window.addEventListener('resize', resize);

  function spawnTarget() {
    targets.push({
      x: rand(50, VIEW_W - 50),
      y: rand(90, VIEW_H - 50),
      r: rand(TARGET_R_MIN, TARGET_R_MAX),
      life: rand(TARGET_LIFE_MIN, TARGET_LIFE_MAX),
      maxLife: 0
    });
    targets[targets.length - 1].maxLife = targets[targets.length - 1].life;
  }

  function resetGame() {
    score = 0;
    timeLeft = 60;
    streak = 0;
    bestStreak = 0;
    hitCount = 0;
    lastFrameTime = null;
    spawnAccum = 0;
    targets = [];
    particles = [];
    pops = [];
    flashes = [];
    recoil.x = 0; recoil.y = 0;
    basePointer.x = VIEW_W / 2; basePointer.y = VIEW_H / 2;
  }

  function start() {
    resetGame();
    state = 'play';
    titleScreen.style.display = 'none';
    overScreen.style.display = 'none';
    updateHud();
  }

  function endGame() {
    state = 'over';
    resultGuardUntil = performance.now() + 500;
    finalScore.textContent = 'SCORE ' + score;
    finalBest.textContent = 'BEST STREAK ' + bestStreak;
    overScreen.style.display = 'flex';
  }

  function updateHud() {
    scoreVal.textContent = String(score);
    var pct = Math.round((Math.sqrt(recoil.x * recoil.x + recoil.y * recoil.y) / MAX_RECOIL) * 100);
    driftVal.textContent = String(clamp(pct, 0, 100)) + '%';
    timeVal.textContent = String(Math.max(0, Math.ceil(timeLeft)));
  }

  function addParticleBurst(x, y, color) {
    for (var i = 0; i < 10; i++) {
      var ang = rand(0, Math.PI * 2);
      var spd = rand(60, 180);
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: 0.5, maxLife: 0.5, color: color
      });
    }
  }

  function addScorePop(x, y, text) {
    pops.push({ x: x, y: y, life: 0.7, maxLife: 0.7, text: text });
  }

  function addFlash(x, y, hit) {
    flashes.push({ x: x, y: y, life: 0.22, maxLife: 0.22, hit: hit });
  }

  function firePosition() {
    return {
      x: clamp(basePointer.x + recoil.x, 0, VIEW_W),
      y: clamp(basePointer.y + recoil.y, 0, VIEW_H)
    };
  }

  function fire() {
    if (state !== 'play') return;
    var p = firePosition();

    var bestIdx = -1, bestDist = 1e9;
    for (var i = 0; i < targets.length; i++) {
      var t = targets[i];
      var dx = t.x - p.x, dy = t.y - p.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d <= t.r + HIT_PAD && d < bestDist) { bestDist = d; bestIdx = i; }
    }

    if (bestIdx >= 0) {
      var hitT = targets[bestIdx];
      streak++;
      if (streak > bestStreak) bestStreak = streak;
      var gain = 10 + Math.min(streak, 8) * 2;
      score += gain;
      hitCount++;
      addParticleBurst(hitT.x, hitT.y, '#7fe89f');
      addScorePop(hitT.x, hitT.y - hitT.r - 10, '+' + gain);
      addFlash(p.x, p.y, true);
      targets.splice(bestIdx, 1);
    } else {
      streak = 0;
      addFlash(p.x, p.y, false);
    }

    var kickAngle = rand(-0.55, 0.55) - Math.PI / 2;
    recoil.x += Math.cos(kickAngle) * KICK_MAG;
    recoil.y += Math.sin(kickAngle) * KICK_MAG;
    var mag = Math.sqrt(recoil.x * recoil.x + recoil.y * recoil.y);
    if (mag > MAX_RECOIL) {
      var s = MAX_RECOIL / mag;
      recoil.x *= s; recoil.y *= s;
    }
  }

  function updateTargets(dt) {
    for (var i = targets.length - 1; i >= 0; i--) {
      targets[i].life -= dt;
      if (targets[i].life <= 0) {
        targets.splice(i, 1);
        streak = 0;
      }
    }
  }

  function updateEffects(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (var j = pops.length - 1; j >= 0; j--) {
      var s = pops[j];
      s.y -= 26 * dt;
      s.life -= dt;
      if (s.life <= 0) pops.splice(j, 1);
    }
    for (var k = flashes.length - 1; k >= 0; k--) {
      flashes[k].life -= dt;
      if (flashes[k].life <= 0) flashes.splice(k, 1);
    }
  }

  function updateRecoil(dt) {
    var decay = Math.exp(-RECOVERY_RATE * dt);
    recoil.x *= decay;
    recoil.y *= decay;
    if (Math.abs(recoil.x) < 0.01) recoil.x = 0;
    if (Math.abs(recoil.y) < 0.01) recoil.y = 0;
  }

  function updateKeyboardAim(dt) {
    var dx = 0, dy = 0;
    if (keys.left) dx -= 1;
    if (keys.right) dx += 1;
    if (keys.up) dy -= 1;
    if (keys.down) dy += 1;
    if (dx !== 0 || dy !== 0) {
      var len = Math.sqrt(dx * dx + dy * dy);
      basePointer.x = clamp(basePointer.x + (dx / len) * KEY_SPEED * dt, 0, VIEW_W);
      basePointer.y = clamp(basePointer.y + (dy / len) * KEY_SPEED * dt, 0, VIEW_H);
    }
  }

  function drawBackground() {
    ctx.clearRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#0a0c12';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  function drawTargets() {
    for (var i = 0; i < targets.length; i++) {
      var t = targets[i];
      var frac = clamp(t.life / t.maxLife, 0, 1);
      ctx.save();
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
      ctx.fillStyle = '#123024';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#7fe89f';
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.r + 6, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
      ctx.strokeStyle = 'rgba(127,232,159,0.55)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var a = clamp(p.life / p.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.restore();
    }
    for (var j = 0; j < pops.length; j++) {
      var s = pops[j];
      var alpha = clamp(s.life / s.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#eafcff';
      ctx.font = '20px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(s.text, s.x, s.y);
      ctx.restore();
    }
    for (var k = 0; k < flashes.length; k++) {
      var f = flashes[k];
      var fa = clamp(f.life / f.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = fa;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 14 * (1 - fa) + 4, 0, Math.PI * 2);
      ctx.strokeStyle = f.hit ? '#bdffcf' : '#ff6f6f';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawReticle() {
    var p = firePosition();
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.arc(basePointer.x, basePointer.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#9fb7d6';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(basePointer.x, basePointer.y);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = '#ff9f5f';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = '#ff9f5f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x - 14, p.y); ctx.lineTo(p.x - 4, p.y);
    ctx.moveTo(p.x + 4, p.y); ctx.lineTo(p.x + 14, p.y);
    ctx.moveTo(p.x, p.y - 14); ctx.lineTo(p.x, p.y - 4);
    ctx.moveTo(p.x, p.y + 4); ctx.lineTo(p.x, p.y + 14);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#ff9f5f';
    ctx.fill();
    ctx.restore();
  }

  function render(now) {
    drawBackground();
    if (state === 'play' || state === 'over') {
      drawTargets();
      drawParticles();
      if (state === 'play') drawReticle();
    }
  }

  function tick(now) {
    if (state === 'play') {
      if (lastFrameTime === null) lastFrameTime = now;
      var dt = (now - lastFrameTime) / 1000;
      if (dt < 0) dt = 0;
      if (dt > 0.05) dt = 0.05;
      lastFrameTime = now;

      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateKeyboardAim(dt);
        updateTargets(dt);
        updateEffects(dt);
        updateRecoil(dt);
        updateHud();
        render(now);
        endGame();
        requestAnimationFrame(tick);
        return;
      }

      updateKeyboardAim(dt);

      spawnAccum += dt;
      while (spawnAccum >= SPAWN_INTERVAL && targets.length < MAX_TARGETS) {
        spawnAccum -= SPAWN_INTERVAL;
        spawnTarget();
      }

      updateTargets(dt);
      updateEffects(dt);
      updateRecoil(dt);
      updateHud();
    }
    render(now);
    requestAnimationFrame(tick);
  }

  function eventToCanvasXY(e) {
    var rect = canvas.getBoundingClientRect();
    var w = rect.width || VIEW_W, h = rect.height || VIEW_H;
    return {
      x: (e.clientX - rect.left) * (VIEW_W / w),
      y: (e.clientY - rect.top) * (VIEW_H / h)
    };
  }

  function onPointerMove(e) {
    if (state !== 'play') return;
    var p = eventToCanvasXY(e);
    basePointer.x = clamp(p.x, 0, VIEW_W);
    basePointer.y = clamp(p.y, 0, VIEW_H);
  }

  function onPointerDown(e) {
    if (e && typeof e.preventDefault === 'function') e.preventDefault();
    if (state === 'title') { start(); return; }
    var p = eventToCanvasXY(e);
    basePointer.x = clamp(p.x, 0, VIEW_W);
    basePointer.y = clamp(p.y, 0, VIEW_H);
    fire();
  }

  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerdown', onPointerDown);

  var keys = { left: false, right: false, up: false, down: false };
  document.addEventListener('keydown', function (e) {
    var k = e && (e.key || e.code);
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = true;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.up = true;
    else if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = true;
    else if (k === ' ' || k === 'Space' || k === 'Enter') {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      if (state === 'title') { start(); return; }
      if (state === 'over' && performance.now() >= resultGuardUntil) { start(); return; }
      fire();
    }
  });
  document.addEventListener('keyup', function (e) {
    var k = e && (e.key || e.code);
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.up = false;
    else if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = false;
  });

  startBtn.addEventListener('click', function () {
    if (state === 'title') start();
  });

  replayBtn.addEventListener('click', function () {
    if (state === 'over' && performance.now() >= resultGuardUntil) start();
  });

  window.__GAME__ = {
    start: start,
    get state() { return state; },
    get timeLeft() { return timeLeft; },
    get score() { return score; },
    checkSuccess: function () { return hitCount >= 1; }
  };

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
