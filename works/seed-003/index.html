<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BEACON WATCH — 60秒灯台信号捕捉トイ</title>
<style>
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:#050b1a; color:#ffe9bf;
    font-family:ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #game{
    position:fixed; inset:0; width:100%; height:100%;
    display:block; touch-action:none; cursor:crosshair;
  }
  .screen{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:16px;
    background:rgba(4,9,20,.84);
  }
  .hidden{ display:none !important; }
  h1{
    margin:0 0 10px; font-size:clamp(26px,6.6vw,46px); letter-spacing:.14em;
    color:#ffd27a; text-shadow:0 0 6px rgba(255,210,122,.6), 0 0 26px rgba(255,170,60,.35);
  }
  h2{
    margin:0 0 10px; font-size:clamp(22px,5.6vw,34px); letter-spacing:.16em;
    color:#9fd7ff; text-shadow:0 0 16px rgba(140,210,255,.6);
  }
  .sub{ margin:0 0 14px; opacity:.92; font-size:clamp(12px,3.2vw,15px); color:#ffdca0; }
  .help{
    margin:0 0 20px; line-height:1.85; font-size:clamp(11px,3vw,13px);
    color:#cfe3ff; opacity:.9; max-width:52ch;
  }
  .help b{ color:#ffd27a; }
  .help i{ color:#8ecbff; font-style:normal; }
  .btn{
    font:inherit; font-weight:700; font-size:clamp(15px,4vw,19px);
    letter-spacing:.1em; color:#241300; cursor:pointer;
    background:linear-gradient(180deg,#ffe08a,#ff9f3d);
    border:0; border-radius:6px; padding:13px 38px;
    box-shadow:0 0 18px rgba(255,170,60,.5), inset 0 -3px 0 rgba(90,40,0,.35);
  }
  .btn:active{ transform:translateY(2px); }
  #finalScore{
    font-size:clamp(40px,10vw,72px); font-weight:800; line-height:1.1;
    color:#ffd27a; text-shadow:0 0 22px rgba(255,190,110,.75);
    margin:4px 0 6px;
  }
  #resultDetail{ margin:0 0 4px; color:#cfe3ff; opacity:.92; font-size:clamp(12px,3.2vw,15px); }
  #bestLine{ margin:14px 0 0; font-size:12px; color:#8ecbff; opacity:.85; }
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; justify-content:space-between; align-items:baseline;
    padding:10px 14px; pointer-events:none;
    font-weight:700; font-size:clamp(13px,3.4vw,17px);
    text-shadow:0 0 8px rgba(255,190,110,.5);
  }
  #hud .label{ font-size:.68em; opacity:.7; letter-spacing:.1em; margin-right:.4em; }
  #timeEl{
    font-size:clamp(18px,4.6vw,26px); color:#ffe9bf; font-variant-numeric:tabular-nums;
  }
  #timeEl.warn{ color:#ff8b6b; text-shadow:0 0 12px rgba(255,139,107,.8); }
  #streakEl{ color:#8ecbff; }
  #muteBtn{
    position:fixed; left:10px; bottom:10px; z-index:6;
    width:42px; height:42px; border-radius:6px; border:1px solid rgba(255,210,122,.4);
    background:rgba(20,14,4,.6); color:#ffd27a; font-size:16px; cursor:pointer;
  }
  .tag{ position:fixed; right:12px; bottom:10px; z-index:4; font-size:10px; opacity:.4; pointer-events:none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div><span class="label">SCORE</span><span id="scoreEl">0</span></div>
  <div id="timeEl">60.0</div>
  <div><span class="label">STREAK</span><span id="streakEl">0</span></div>
</div>

<div id="titleScreen" class="screen">
  <h1>BEACON WATCH</h1>
  <p class="sub">60秒間、夜の灯台から沖に現れる信号灯を見極めて捉えるトイ</p>
  <p class="help">
    PC:マウスで狙いを合わせてクリック(離した瞬間に判定)<br>
    スマホ:画面を押したままドラッグして狙いを調整し、指を離して捕捉<br>
    キーボード:矢印/A・D で信号灯を選択、Space・Enter で捕捉<br>
    輪が<b>すぼまる中心の一瞬</b>で捉えると PERFECT、それ以外で捉えても GOOD。<i>光が消えるまで放置</i>すると連続記録が途切れる
  </p>
  <button id="startBtn" class="btn">START</button>
  <p id="bestLine" class="hidden">ベスト記録: <span id="bestTitle">0</span> pt</p>
</div>

<div id="overScreen" class="screen hidden">
  <h2>WATCH COMPLETE</h2>
  <div id="finalScore">0 pt</div>
  <p id="resultDetail"></p>
  <button id="replayBtn" class="btn">REPLAY</button>
</div>

<button id="muteBtn" title="サウンド切替">♪</button>
<div class="tag">BEACON WATCH — single-file toy</div>

<script>
"use strict";
(function(){

  // ---------- DOM ----------
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('scoreEl');
  var timeEl = document.getElementById('timeEl');
  var streakEl = document.getElementById('streakEl');
  var hud = document.getElementById('hud');
  var titleScreen = document.getElementById('titleScreen');
  var overScreen = document.getElementById('overScreen');
  var startBtn = document.getElementById('startBtn');
  var replayBtn = document.getElementById('replayBtn');
  var finalScore = document.getElementById('finalScore');
  var resultDetail = document.getElementById('resultDetail');
  var bestLine = document.getElementById('bestLine');
  var bestTitle = document.getElementById('bestTitle');
  var muteBtn = document.getElementById('muteBtn');

  // ---------- 画面サイズ ----------
  var W = 960, H = 600, DPR = 1;
  function fit(){
    W = window.innerWidth || 960;
    H = window.innerHeight || 600;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  fit();
  window.addEventListener('resize', fit);

  // ---------- 定数 ----------
  var GAME_TIME = 60;
  var FLARE_LIFE = 1.55;
  var CORE_START = 0.42;
  var CORE_END = 0.78;
  var R_MAX = 52;
  var HIT_PAD = 16;
  var REPLAY_GUARD = 0.6;

  function rand(a, b){ return a + Math.random() * (b - a); }

  // ---------- 星空(初期化時に一度だけ生成) ----------
  var stars = [];
  (function initStars(){
    for (var i = 0; i < 70; i++){
      stars.push({ x: Math.random(), y: Math.random() * 0.62, r: rand(0.6, 1.8), seed: Math.random() * 6.28 });
    }
  })();

  // ---------- 状態 ----------
  var state = 'title';
  var score = 0, streak = 0, best = 0;
  var perfectCount = 0, goodCount = 0, emptyCount = 0, leakCount = 0;
  var timeLeft = GAME_TIME;
  var overAt = -10;
  var tNow = 0, lastT = null;

  var flares = [];
  var nextSpawnAt = 0;
  var selectedIndex = 0;

  var spotX = W / 2, spotY = H / 2;
  var pressId = null;
  var lastFxList = [];

  // ---------- 音(生成音のみ・存在チェック+try/catch) ----------
  var audioCtx = null, muted = false;
  function initAudio(){
    if (audioCtx || muted) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e){ audioCtx = null; }
  }
  function playTone(freq, dur, type, gain){
    if (!audioCtx || muted) return;
    try {
      var t0 = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain || 0.18, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    } catch (e){ /* 無音環境では何もしない */ }
  }
  function sfx(name){
    if (name === 'perfect') playTone(880, 0.16, 'triangle', 0.2);
    else if (name === 'good') playTone(560, 0.13, 'sine', 0.16);
    else if (name === 'empty') playTone(220, 0.1, 'square', 0.08);
    else if (name === 'leak') playTone(160, 0.22, 'sawtooth', 0.1);
    else if (name === 'start') playTone(660, 0.14, 'sine', 0.18);
    else if (name === 'end') playTone(340, 0.3, 'triangle', 0.18);
  }
  muteBtn.addEventListener('click', function(){
    muted = !muted;
    muteBtn.textContent = muted ? '×' : '♪';
  });

  // ---------- HUD ----------
  function updateHud(){
    scoreEl.textContent = String(score);
    streakEl.textContent = String(streak);
  }
  function show(el){ el.classList.remove('hidden'); }
  function hide(el){ el.classList.add('hidden'); }

  // ---------- 信号灯(flare) ----------
  function spawnFlare(){
    var mx = W * 0.12, my = H * 0.2;
    flares.push({
      x: rand(mx, W - mx),
      y: rand(my, H - my * 1.1),
      bornT: tNow
    });
  }
  function flareRadius(f){
    var frac = Math.min(1, (tNow - f.bornT) / FLARE_LIFE);
    return Math.max(0, R_MAX * (1 - frac));
  }
  function flareFrac(f){
    return (tNow - f.bornT) / FLARE_LIFE;
  }

  function updateSpawns(){
    if (state !== 'play') return;
    var elapsed = GAME_TIME - timeLeft;
    var maxActive = elapsed < 20 ? 1 : 2;
    if (tNow >= nextSpawnAt && flares.length < maxActive){
      spawnFlare();
      var k = Math.min(1, elapsed / GAME_TIME);
      var spMin = 0.85 - 0.5 * k;
      var spMax = 1.35 - 0.75 * k;
      nextSpawnAt = tNow + rand(spMin, spMax);
    }
    for (var i = flares.length - 1; i >= 0; i--){
      if (flareFrac(flares[i]) >= 1){
        flares.splice(i, 1);
        leakCount++;
        streak = 0;
        addFx(0, 0, '', 0);
      }
    }
    if (selectedIndex >= flares.length) selectedIndex = Math.max(0, flares.length - 1);
  }

  function addFx(x, y, text, color){
    if (!text) return;
    lastFxList.push({ x: x, y: y, text: text, color: color, t0: tNow });
  }

  function tryHit(px, py){
    if (state !== 'play') return;
    var bestI = -1, bestD = 1e9;
    for (var i = 0; i < flares.length; i++){
      var f = flares[i];
      var r = flareRadius(f);
      var dx = f.x - px, dy = f.y - py;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d <= r + HIT_PAD && d < bestD){ bestD = d; bestI = i; }
    }
    if (bestI < 0){
      emptyCount++;
      streak = 0;
      addFx(px, py, 'MISS', '#8ecbff');
      sfx('empty');
      updateHud();
      return;
    }
    var hit = flares[bestI];
    var frac = flareFrac(hit);
    flares.splice(bestI, 1);
    streak++;
    var bonus = Math.min(5, Math.floor(streak / 3));
    var pts;
    if (frac >= CORE_START && frac <= CORE_END){
      pts = 3 + bonus;
      perfectCount++;
      addFx(hit.x, hit.y, 'PERFECT +' + pts, '#ffd27a');
      sfx('perfect');
    } else {
      pts = 1 + bonus;
      goodCount++;
      addFx(hit.x, hit.y, 'GOOD +' + pts, '#8ecbff');
      sfx('good');
    }
    score += pts;
    updateHud();
  }

  function confirmSelected(){
    if (flares.length === 0) return;
    var f = flares[Math.min(selectedIndex, flares.length - 1)];
    tryHit(f.x, f.y);
  }
  function moveSelection(delta){
    if (flares.length === 0) return;
    selectedIndex = ((selectedIndex + delta) % flares.length + flares.length) % flares.length;
  }

  // ---------- 状態遷移 ----------
  function start(){
    score = 0; streak = 0; timeLeft = GAME_TIME;
    perfectCount = 0; goodCount = 0; emptyCount = 0; leakCount = 0;
    flares = []; nextSpawnAt = tNow + 0.4; selectedIndex = 0;
    lastFxList = [];
    state = 'play';
    hide(titleScreen); hide(overScreen); show(hud);
    timeEl.classList.remove('warn');
    updateHud();
    initAudio();
    sfx('start');
  }
  function finish(){
    if (state !== 'play') return;
    state = 'over';
    overAt = tNow;
    if (score > best) best = score;
    finalScore.textContent = score + ' pt';
    resultDetail.textContent = 'PERFECT ' + perfectCount + ' / GOOD ' + goodCount +
      ' / 空振り ' + emptyCount + ' / 見逃し ' + leakCount + '・ベスト ' + best + ' pt';
    hide(hud); show(overScreen);
    sfx('end');
  }
  function toTitle(){
    state = 'title';
    hide(hud); hide(overScreen); show(titleScreen);
    if (best > 0){ bestTitle.textContent = String(best); show(bestLine); }
  }
  function attemptStart(){
    if (state === 'title'){ start(); return; }
    if (state === 'over' && tNow - overAt > REPLAY_GUARD){ start(); }
  }
  startBtn.addEventListener('click', function(){ initAudio(); attemptStart(); });
  replayBtn.addEventListener('click', function(){ initAudio(); attemptStart(); });

  // ---------- 入力: ポインタ(押す→ドラッグで狙い調整→離して捕捉) ----------
  function eventToCanvasXY(e){
    var rect = canvas.getBoundingClientRect();
    var w = rect.width || W, h = rect.height || H;
    return {
      x: (e.clientX - rect.left) * (W / w),
      y: (e.clientY - rect.top) * (H / h)
    };
  }
  canvas.addEventListener('pointerdown', function(e){
    initAudio();
    if (e.preventDefault) e.preventDefault();
    var p = eventToCanvasXY(e);
    spotX = p.x; spotY = p.y;
    pressId = e.pointerId;
  }, { passive: false });
  canvas.addEventListener('pointermove', function(e){
    var p = eventToCanvasXY(e);
    spotX = p.x; spotY = p.y;
  }, { passive: true });
  canvas.addEventListener('pointerup', function(e){
    if (pressId !== null && e.pointerId === pressId){
      var p = eventToCanvasXY(e);
      tryHit(p.x, p.y);
    }
    pressId = null;
  });
  canvas.addEventListener('pointercancel', function(){ pressId = null; });
  canvas.addEventListener('contextmenu', function(e){ if (e.preventDefault) e.preventDefault(); });

  // ---------- 入力: キーボード(選択→確定) ----------
  window.addEventListener('keydown', function(e){
    initAudio();
    var k = e.key;
    if (k === 'ArrowRight' || k === 'd' || k === 'D'){
      if (e.preventDefault) e.preventDefault();
      moveSelection(1);
    } else if (k === 'ArrowLeft' || k === 'a' || k === 'A'){
      if (e.preventDefault) e.preventDefault();
      moveSelection(-1);
    } else if (k === 'ArrowUp' || k === 'ArrowDown' || k === 'w' || k === 'W' || k === 's' || k === 'S'){
      if (e.preventDefault) e.preventDefault();
      moveSelection(k === 'ArrowUp' || k === 'w' || k === 'W' ? -1 : 1);
    } else if (k === ' ' || k === 'Spacebar' || k === 'Enter'){
      if (e.preventDefault) e.preventDefault();
      if (state === 'play') confirmSelected();
      else attemptStart();
    }
  });

  // ---------- 更新 ----------
  function update(dt){
    updateSpawns();

    if (state === 'play'){
      timeLeft -= dt;
      if (timeLeft <= 10.05) timeEl.classList.add('warn');
      if (timeLeft <= 0){
        timeLeft = 0;
        timeEl.textContent = '0.0';
        finish();
      } else {
        timeEl.textContent = timeLeft.toFixed(1);
      }
    }
  }

  // ---------- 描画 ----------
  function drawBackground(){
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#03060f');
    sky.addColorStop(0.62, '#0a1730');
    sky.addColorStop(1, '#132445');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      var tw = 0.5 + 0.5 * Math.sin(tNow * 2 + s.seed);
      ctx.globalAlpha = 0.35 + 0.5 * tw;
      ctx.fillStyle = '#eaf3ff';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    var horizonY = H * 0.64;
    ctx.fillStyle = '#04101f';
    ctx.fillRect(0, horizonY, W, H - horizonY);
    ctx.strokeStyle = 'rgba(150,190,255,.18)';
    ctx.lineWidth = 1;
    for (var wv = 0; wv < 4; wv++){
      var yy = horizonY + 14 + wv * 22;
      ctx.beginPath();
      for (var x = 0; x <= W; x += 24){
        var yOff = Math.sin(x * 0.02 + tNow * 1.1 + wv) * 3;
        if (x === 0) ctx.moveTo(x, yy + yOff); else ctx.lineTo(x, yy + yOff);
      }
      ctx.stroke();
    }

    // 灯台(左下シルエット)と回転するビーム
    var lx = W * 0.09, lbase = horizonY;
    ctx.fillStyle = '#0c1626';
    ctx.beginPath();
    ctx.moveTo(lx - 16, lbase);
    ctx.lineTo(lx - 8, lbase - 130);
    ctx.lineTo(lx + 8, lbase - 130);
    ctx.lineTo(lx + 16, lbase);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1a2740';
    ctx.fillRect(lx - 11, lbase - 150, 22, 20);

    var beamAng = tNow * 0.5;
    var spread = 0.5;
    var len = Math.max(W, H) * 1.3;
    var bx = lx, by = lbase - 140;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(beamAng);
    var beamGrad = ctx.createLinearGradient(0, 0, len, 0);
    beamGrad.addColorStop(0, 'rgba(255,224,150,.32)');
    beamGrad.addColorStop(1, 'rgba(255,224,150,0)');
    ctx.fillStyle = beamGrad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(len, -len * Math.tan(spread / 2));
    ctx.lineTo(len, len * Math.tan(spread / 2));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#ffe9bf';
    ctx.beginPath();
    ctx.arc(bx, by, 5, 0, 6.2832);
    ctx.fill();
  }

  function drawFlare(f, isSelected){
    var r = flareRadius(f);
    var frac = flareFrac(f);
    var inCore = frac >= CORE_START && frac <= CORE_END;
    ctx.save();
    ctx.translate(f.x, f.y);

    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = inCore ? '#ffd27a' : 'rgba(255,210,122,.55)';
    ctx.lineWidth = inCore ? 3 : 1.6;
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(2, r), 0, 6.2832);
    ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.fillStyle = inCore ? '#fff2cf' : '#ffd27a';
    ctx.beginPath();
    ctx.arc(0, 0, 5 + (inCore ? 3 : 0), 0, 6.2832);
    ctx.fill();

    if (isSelected){
      ctx.strokeStyle = '#8ecbff';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(10, r) + 10, 0, 6.2832);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  function drawSpotlight(){
    if (state !== 'play') return;
    ctx.strokeStyle = 'rgba(255,233,191,.8)';
    ctx.lineWidth = 1.5;
    var cr = 13;
    ctx.beginPath();
    ctx.arc(spotX, spotY, cr, 0, 6.2832);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(spotX - cr - 7, spotY); ctx.lineTo(spotX - cr + 2, spotY);
    ctx.moveTo(spotX + cr - 2, spotY); ctx.lineTo(spotX + cr + 7, spotY);
    ctx.moveTo(spotX, spotY - cr - 7); ctx.lineTo(spotX, spotY - cr + 2);
    ctx.moveTo(spotX, spotY + cr - 2); ctx.lineTo(spotX, spotY + cr + 7);
    ctx.stroke();
  }

  function render(){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawBackground();

    for (var i = 0; i < flares.length; i++){
      drawFlare(flares[i], state === 'play' && i === selectedIndex);
    }

    for (var n = lastFxList.length - 1; n >= 0; n--){
      var fx = lastFxList[n];
      var age = tNow - fx.t0;
      var dur = 0.6;
      if (age >= dur){ lastFxList.splice(n, 1); continue; }
      ctx.globalAlpha = 1 - age / dur;
      ctx.fillStyle = fx.color;
      ctx.font = '700 15px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(fx.text, fx.x, fx.y - 30 * (age / dur));
      ctx.globalAlpha = 1;
    }

    drawSpotlight();

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.42)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  // ---------- メインループ ----------
  function frame(ms){
    var t = ms / 1000;
    if (lastT === null) lastT = t;
    var dt = Math.min(0.05, Math.max(0, t - lastT));
    lastT = t;
    tNow = t;
    update(dt);
    render();
    window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);

  // ---------- 検証用フック(UIと同じ関数を公開しているだけ) ----------
  window.__GAME__ = {
    get state(){ return state; },
    get score(){ return score; },
    get timeLeft(){ return timeLeft; },
    get best(){ return best; },
    start: start,
    finish: finish,
    hit: tryHit,
    reset: toTitle,
    version: 1
  };

  toTitle();
})();
</script>
</body>
</html>
