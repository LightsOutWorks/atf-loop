<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>円相 — 幾何学ロゴ設計室</title>
<style>
  :root {
    --chrome: #201f1b;        /* 夜の設計室: 墨がかった暗色 */
    --chrome-2: #2a2924;
    --chrome-3: #35342d;
    --line: #45443c;
    --text: #e8e5da;
    --text-dim: #a09d8f;
    --shu: #b5493a;           /* 朱印の朱 */
    --shu-hover: #c95949;
    --paper: #f4f2ea;
    --radius: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--chrome); color: var(--text); }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: Georgia, 'Times New Roman', 'Hiragino Mincho ProN', 'Yu Mincho', serif; }
  .mono  { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }

  header.app {
    display: flex; align-items: baseline; gap: 14px;
    padding: 18px 26px 16px;
    border-bottom: 1px solid var(--line);
  }
  header.app .brand {
    font-family: Georgia, 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    font-size: 21px; letter-spacing: .12em;
  }
  header.app .brand .en { color: var(--text-dim); font-size: 13px; letter-spacing: .3em; margin-left: 10px; }
  header.app .tag {
    margin-left: auto; font-size: 11px; color: var(--text-dim); letter-spacing: .08em;
  }

  .layout { display: flex; min-height: calc(100vh - 58px); }

  /* ── 操作パネル ───────────────────────── */
  aside.controls {
    width: 296px; flex: none;
    padding: 22px 20px 40px;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 22px;
  }
  .ctl-group > .lbl {
    font-size: 10px; letter-spacing: .22em; color: var(--text-dim);
    font-family: ui-monospace, Menlo, monospace;
    margin-bottom: 9px;
  }
  input[type="text"] {
    width: 100%; padding: 9px 11px;
    background: var(--chrome-2); border: 1px solid var(--line);
    border-radius: var(--radius); color: var(--text);
    font-size: 14px; letter-spacing: .04em;
  }
  input[type="text"]:focus { outline: 2px solid var(--shu); outline-offset: -1px; }

  .motif-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .motif-btn {
    aspect-ratio: 1; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--chrome-2); cursor: pointer; padding: 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    color: var(--text-dim);
    --thumb-bg: var(--chrome-2);
  }
  .motif-btn svg { width: 66%; height: auto; display: block; flex: none; }
  .motif-btn .mname { font-size: 10px; letter-spacing: .02em; }
  .motif-btn:hover { border-color: var(--text-dim); }
  .motif-btn.active { border-color: var(--shu); background: var(--chrome-3); color: var(--text); --thumb-bg: var(--chrome-3); }
  .motif-btn:focus-visible { outline: 2px solid var(--shu); outline-offset: 1px; }
  .motif-btn .big { font-size: 22px; font-family: Georgia, serif; line-height: 1; }

  .swatches { display: flex; gap: 8px; }
  .swatch {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    border: none; padding: 0;
    box-shadow: inset 0 0 0 1px rgba(232,229,218,.3);
  }
  .swatch.active {
    box-shadow: inset 0 0 0 1px rgba(232,229,218,.3),
                0 0 0 2px var(--chrome), 0 0 0 4px var(--shu);
  }
  .swatch:focus-visible { outline: 2px solid var(--shu); outline-offset: 5px; }

  input[type="range"] { width: 100%; accent-color: var(--shu); }
  input[type="range"]:focus-visible { outline: 2px solid var(--shu); outline-offset: 2px; }

  .btn-row { display: flex; gap: 9px; }
  button.gen {
    flex: 1; padding: 12px 0; border: none; border-radius: var(--radius);
    background: var(--shu); color: #f6efe9; font-size: 14px; letter-spacing: .35em; text-indent: .35em;
    cursor: pointer; font-family: inherit;
  }
  button.gen:hover { background: var(--shu-hover); }
  button.ghost {
    padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius);
    background: transparent; color: var(--text-dim); font-size: 12px; letter-spacing: .1em;
    cursor: pointer; font-family: inherit;
  }
  button.ghost:hover { color: var(--text); border-color: var(--text-dim); }
  button:focus-visible { outline: 2px solid var(--shu); outline-offset: 2px; }

  .hint { font-size: 10.5px; color: var(--text-dim); line-height: 1.7; }

  /* ── 出力 ───────────────────────── */
  main.out {
    flex: 1; padding: 30px 34px 60px;
    display: flex; flex-wrap: wrap; gap: 28px; align-content: flex-start; justify-content: center;
  }
  .card-wrap { display: flex; flex-direction: column; gap: 10px; width: min(430px, 100%); }
  .card {
    background: var(--paper); border-radius: 3px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
  }
  .card svg { display: block; width: 100%; height: auto; }
  .card-tools { display: flex; gap: 8px; align-items: center; }
  .card-tools .cap {
    font-size: 10px; letter-spacing: .2em; color: var(--text-dim);
    font-family: ui-monospace, Menlo, monospace; margin-right: auto;
  }
  .card-tools button {
    padding: 6px 12px; font-size: 11px; letter-spacing: .06em;
    background: var(--chrome-2); color: var(--text-dim);
    border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer;
    font-family: inherit;
  }
  .card-tools button:hover { color: var(--text); border-color: var(--text-dim); }

  /* 生成アニメーション */
  @media (prefers-reduced-motion: no-preference) {
    .card.drawing .guide > * { transition: stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1); }
    .card .fade { transition: opacity .8s ease; }
  }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }

  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    aside.controls { width: 100%; border-right: none; border-bottom: 1px solid var(--line); }
    main.out { padding: 22px 14px 50px; }
    .swatch { width: 42px; height: 42px; }
    .card-tools button { padding: 10px 16px; }
  }
</style>
</head>
<body>
<header class="app">
  <div class="brand">円相<span class="en">ENSŌ</span></div>
  <div class="tag">幾何学ロゴ設計室 — コンパスと定規で、ロゴを組み立てる</div>
</header>

<div class="layout">
  <aside class="controls">
    <div class="ctl-group">
      <label class="lbl" for="brandName">BRAND NAME — ブランド名</label>
      <input type="text" id="brandName" value="Ensō" maxlength="24">
    </div>

    <div class="ctl-group">
      <div class="lbl" id="lblMotif">MOTIF — モチーフ</div>
      <div class="motif-grid" id="motifGrid" role="group" aria-labelledby="lblMotif"></div>
    </div>

    <div class="ctl-group">
      <div class="lbl" id="lblInk">INK — インク</div>
      <div class="swatches" id="inkSwatches" role="group" aria-labelledby="lblInk"></div>
    </div>

    <div class="ctl-group">
      <div class="lbl" id="lblPaper">PAPER — 紙</div>
      <div class="swatches" id="paperSwatches" role="group" aria-labelledby="lblPaper"></div>
    </div>

    <div class="ctl-group">
      <div class="lbl" id="lblDensity">GUIDE DENSITY — 補助線の密度</div>
      <input type="range" id="density" min="20" max="100" value="65" aria-labelledby="lblDensity">
    </div>

    <div class="btn-row">
      <button class="gen" id="genBtn">設計する</button>
    </div>

    <p class="hint">モチーフを円・楕円・多角形の集積として構成し、その構成図形をそのまま作図補助線として設計シートに展開します。「設計する」を押すたびに補助線の引き方（抽象・モノグラムは形も）が変わります。すべてブラウザ内で完結（外部通信なし）。</p>
    <p class="visually-hidden" aria-live="polite" id="renderStatus"></p>
  </aside>

  <main class="out">
    <div class="card-wrap">
      <div class="card" id="sheetCard"></div>
      <div class="card-tools">
        <span class="cap">CONSTRUCTION SHEET</span>
        <button data-dl="svg" data-target="sheet" aria-label="設計シートをSVG形式でダウンロード">↓ SVG</button>
        <button data-dl="png" data-target="sheet" aria-label="設計シートをPNG形式でダウンロード">↓ PNG</button>
      </div>
    </div>
    <div class="card-wrap">
      <div class="card" id="logoCard"></div>
      <div class="card-tools">
        <span class="cap">FINAL MARK</span>
        <button data-dl="svg" data-target="logo" aria-label="完成ロゴをSVG形式でダウンロード">↓ SVG</button>
        <button data-dl="png" data-target="logo" aria-label="完成ロゴをPNG形式でダウンロード">↓ PNG</button>
      </div>
    </div>
  </main>
</div>

/* ── 乱数（seeded） ── */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ── SVGユーティリティ ── */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const fmt = n => Math.round(n * 10) / 10;

/* 塗りのマーク本体（paths＋circles＋texts、painter's algorithm） */
function markBody(motif, ink, paper) {
  let out = '';
  (motif.paths || []).forEach(p => {
    out += `<path d="${esc(p.d)}" fill="${p.op === 'cut' ? paper : ink}"/>`;
  });
  (motif.circles || []).forEach(c => {
    out += `<circle cx="${fmt(c.cx)}" cy="${fmt(c.cy)}" r="${fmt(c.r)}" fill="${c.op === 'cut' ? paper : ink}"/>`;
  });
  (motif.texts || []).forEach(t => {
    out += `<text x="${fmt(t.x)}" y="${fmt(t.y)}" font-size="${fmt(t.size)}" font-family="Georgia,'Times New Roman','Hiragino Mincho ProN',serif" fill="${ink}" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">${esc(t.ch)}</text>`;
  });
  return out;
}

function markSVG(motif, ink, paper, size) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 512 512">${markBody(motif, ink, paper)}</svg>`;
}

/* 512座標のマークを (x,y) に size で置くグループ（ネストsvgはHTMLパーサで
   viewBoxが落ちる環境があるため transform 方式で統一する） */
function placedMark(motif, ink, paper, x, y, size) {
  return `<g transform="translate(${fmt(x)},${fmt(y)}) scale(${fmt2(size / 512)})">${markBody(motif, ink, paper)}</g>`;
}
const fmt2 = n => Math.round(n * 10000) / 10000;

/* ── 作図補助線エンジン v2 ──
   完成パスの輪郭を高密度サンプリングし、円弧らしい区間へ最小二乗
   （Kåsa法）で円をフィットして「コンパスで作図した」構図を逆算する。
   参考にした本物の黄金比ロゴシートと同じ後付けの作法。座標系はマーク座標（512）。 */

function parsePathPoints(d) {
  // 絶対座標 M/L/C/Q/Z を想定。サブパスごとの高密度サンプル点列を返す
  const tokens = String(d).match(/[A-Za-z]|-?\d*\.?\d+(?:e-?\d+)?/g) || [];
  const subs = [];
  let pts = null, cur = null, start = null, i = 0;
  const num = () => parseFloat(tokens[i++]);
  while (i < tokens.length) {
    const t = tokens[i++];
    if (t === 'M') { if (pts && pts.length > 8) subs.push(pts); pts = []; cur = [num(), num()]; start = cur; pts.push(cur); }
    else if (t === 'L') { const p = [num(), num()]; samplePolyline(pts, cur, p); cur = p; }
    else if (t === 'C') { const c1 = [num(), num()], c2 = [num(), num()], p = [num(), num()]; sampleCubic(pts, cur, c1, c2, p); cur = p; }
    else if (t === 'Q') {
      const c = [num(), num()], p = [num(), num()];
      sampleCubic(pts, cur,
        [cur[0] + (c[0] - cur[0]) * 2 / 3, cur[1] + (c[1] - cur[1]) * 2 / 3],
        [p[0] + (c[0] - p[0]) * 2 / 3, p[1] + (c[1] - p[1]) * 2 / 3], p);
      cur = p;
    }
    else if (t === 'Z' || t === 'z') { if (start && cur) samplePolyline(pts, cur, start); cur = start; }
  }
  if (pts && pts.length > 8) subs.push(pts);
  return subs;
}
function samplePolyline(out, a, b) {
  const n = Math.max(2, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 7));
  for (let k = 1; k <= n; k++) out.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
}
function sampleCubic(out, p0, c1, c2, p3) {
  const n = 22;
  for (let k = 1; k <= n; k++) {
    const t = k / n, u = 1 - t;
    out.push([
      u * u * u * p0[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * p3[0],
      u * u * u * p0[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * p3[1],
    ]);
  }
}

/* Kåsa法: Σ(x²+y²+Dx+Ey+F)² を最小化する円フィット */
function kasaFit(pts) {
  let sxx = 0, sxy = 0, sx = 0, syy = 0, sy = 0, bx = 0, by = 0, bc = 0;
  const n = pts.length;
  for (const [x, y] of pts) {
    const z = x * x + y * y;
    sxx += x * x; sxy += x * y; sx += x; syy += y * y; sy += y;
    bx -= x * z; by -= y * z; bc -= z;
  }
  const M = [[sxx, sxy, sx], [sxy, syy, sy], [sx, sy, n]];
  const B = [bx, by, bc];
  const det = m => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1])
               - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0])
               + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
  const D0 = det(M);
  if (Math.abs(D0) < 1e-9) return null;
  const rep = (m, col, v) => m.map((row, ri) => row.map((x, ci) => ci === col ? v[ri] : x));
  const Dv = det(rep(M, 0, B)) / D0, Ev = det(rep(M, 1, B)) / D0, Fv = det(rep(M, 2, B)) / D0;
  const cx = -Dv / 2, cy = -Ev / 2, r2 = cx * cx + cy * cy - Fv;
  if (r2 <= 0) return null;
  const r = Math.sqrt(r2);
  let rms = 0;
  for (const [x, y] of pts) { const e = Math.hypot(x - cx, y - cy) - r; rms += e * e; }
  return { cx, cy, r, rms: Math.sqrt(rms / n) };
}

/* 輪郭のスライディングウィンドウに円を当て、弧として成立する区間だけ残す。
   細部用（窓小・厳しめ）と大弧用（窓大・緩め）の2スケールで走らせ、
   お手本のシートに近い「大小の円が重なる」密度を得る */
function fitConstructionCircles(motif) {
  const fits = [];
  const SCALES = [
    { win: 0.08, step: 0.035, rmsK: 0.02, rmsMin: 0.9, arcMin: 0.5 },
    { win: 0.22, step: 0.08, rmsK: 0.035, rmsMin: 1.6, arcMin: 0.45 },
  ];
  for (const p of motif.paths || []) {
    for (const pts of parsePathPoints(p.d)) {
      const N = pts.length;
      for (const sc of SCALES) {
        const win = Math.max(12, Math.round(N * sc.win));
        const step = Math.max(4, Math.round(N * sc.step));
        for (let s0 = 0; s0 < N; s0 += step) {
          const w = [];
          for (let k = 0; k < win; k++) w.push(pts[(s0 + k) % N]);
          const f = kasaFit(w);
          if (!f || f.r < 10 || f.r > 460) continue;
          if (f.rms > Math.max(sc.rmsMin, f.r * sc.rmsK)) continue;
          let arc = 0;
          for (let k = 1; k < w.length; k++) arc += Math.hypot(w[k][0] - w[k - 1][0], w[k][1] - w[k - 1][1]);
          if (arc / f.r < sc.arcMin) continue;   // ほぼ直線は捨てる
          fits.push(f);
        }
      }
    }
  }
  fits.sort((a, b) => a.rms - b.rms);
  const kept = [];
  for (const f of fits) {
    const dup = kept.some(k => {
      const m = Math.max(k.r, f.r);
      // 中心も半径も近い場合のみ重複扱い（同心の別半径円は残す）
      return Math.hypot(k.cx - f.cx, k.cy - f.cy) < m * 0.16 && Math.abs(k.r - f.r) < m * 0.055;
    });
    if (!dup) kept.push(f);
  }
  for (const c of motif.circles || []) kept.push({ cx: c.cx, cy: c.cy, r: c.r, rms: 0 });
  return phiSnap(kept);
}

/* φ階梯へのスナップ: 最大円を基準 R とし、各円の半径を R/φ^k（12%以内）へ吸着。
   吸着できた円は k を持ち、シート上で「R/φ²」のように注記される */
function phiSnap(fits) {
  if (!fits.length) return fits;
  const Rbase = Math.max(...fits.map(f => f.r));
  for (const f of fits) {
    const k = Math.log(Rbase / f.r) / Math.log(PHI);
    const kr = Math.round(k);
    const snapped = Rbase / Math.pow(PHI, kr);
    if (kr >= 0 && Math.abs(snapped - f.r) <= f.r * 0.12) {
      f.r = snapped;
      f.phiK = kr;
    }
  }
  fits.Rbase = Rbase;
  return fits;
}

function buildGuides(motif, seed, density) {
  const rng = mulberry32(seed);
  const g = { strokes: [], lines: [], dashed: [], ticks: [], labels: [] };
  const fits = fitConstructionCircles(motif);

  // 大きい円を優先しつつ seeded に採用本数を決める（お手本は円25〜40個）
  const byR = fits.slice().sort((a, b) => b.r - a.r);
  const want = Math.round(14 + 30 * density);
  const chosen = [];
  for (const f of byR) {
    if (chosen.length >= want) break;
    if (rng() < 0.42 + 0.5 * density) chosen.push(f);
  }
  for (const f of byR) {
    if (chosen.length >= want) break;
    if (!chosen.includes(f)) chosen.push(f);
  }

  const clipLine = (x1, y1, x2, y2) => {
    const dx = x2 - x1, dy = y2 - y1;
    const L = Math.hypot(dx, dy) || 1;
    const ux = dx / L, uy = dy / L, far = 3000;
    return { x1: x1 - ux * far, y1: y1 - uy * far, x2: x1 + ux * far, y2: y1 + uy * far };
  };
  const pushLine = (x1, y1, x2, y2) => {
    const l = clipLine(x1, y1, x2, y2);
    g.lines.push(`<line x1="${fmt(l.x1)}" y1="${fmt(l.y1)}" x2="${fmt(l.x2)}" y2="${fmt(l.y2)}"/>`);
  };

  // 1. フィットした円を stroke（これが主役）＋中心の十字ティック
  chosen.forEach(f => {
    g.strokes.push(`<circle cx="${fmt(f.cx)}" cy="${fmt(f.cy)}" r="${fmt(f.r)}" fill="none"/>`);
    const t = 4;
    g.ticks.push(`M ${fmt(f.cx - t)} ${fmt(f.cy)} H ${fmt(f.cx + t)} M ${fmt(f.cx)} ${fmt(f.cy - t)} V ${fmt(f.cy + t)}`);
  });

  // 2. シルエット外接の水平・垂直接線
  const subsAll = (motif.paths || []).flatMap(p => parsePathPoints(p.d));
  const allPts = subsAll.flat();
  if (allPts.length) {
    const xs = allPts.map(p => p[0]), ys = allPts.map(p => p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    if (rng() < 0.85 * density) pushLine(minX, 0, minX, 10);
    if (rng() < 0.85 * density) pushLine(maxX, 0, maxX, 10);
    if (rng() < 0.85 * density) pushLine(0, minY, 10, minY);
    if (rng() < 0.85 * density) pushLine(0, maxY, 10, maxY);
  }

  // 3. 主要円の水平・垂直接線
  chosen.slice(0, 12).forEach(f => {
    if (rng() < 0.5 * density) pushLine(f.cx - 10, f.cy - f.r, f.cx + 10, f.cy - f.r);
    if (rng() < 0.5 * density) pushLine(f.cx - 10, f.cy + f.r, f.cx + 10, f.cy + f.r);
    if (rng() < 0.38 * density) pushLine(f.cx - f.r, f.cy - 10, f.cx - f.r, f.cy + 10);
    if (rng() < 0.38 * density) pushLine(f.cx + f.r, f.cy - 10, f.cx + f.r, f.cy + 10);
  });

  // 4. 円ペアの中心を貫く線
  const majors = chosen.slice(0, 10);
  for (let i = 0; i < majors.length; i++) {
    for (let j = i + 1; j < majors.length; j++) {
      if (rng() < 0.16 * density) {
        const a = majors[i], b = majors[j];
        if (Math.hypot(a.cx - b.cx, a.cy - b.cy) > 24) pushLine(a.cx, a.cy, b.cx, b.cy);
      }
    }
  }

  // 5. 輪郭の接ベクトル延長（シートを横切る長い斜線。お手本の主役級要素）
  const longSubs = subsAll.filter(s => s.length > 30);
  const nTan = Math.round(12 * density) + 4;
  for (let k = 0; k < nTan && longSubs.length; k++) {
    const sp = longSubs[Math.floor(rng() * longSubs.length)];
    const i0 = Math.floor(rng() * sp.length);
    const a = sp[i0], b = sp[(i0 + 4) % sp.length];
    if (Math.hypot(a[0] - b[0], a[1] - b[1]) > 2) pushLine(a[0], a[1], b[0], b[1]);
  }

  // 6. 黄金比の同心円（破線）
  majors.slice(0, 2).forEach((f, i) => {
    if (rng() < 0.85 * density) {
      const r2 = i === 0 ? f.r * PHI : f.r / PHI;
      g.dashed.push(`<circle cx="${fmt(f.cx)}" cy="${fmt(f.cy)}" r="${fmt(r2)}" fill="none"/>`);
    }
  });

  // 7. 半径注記 — φ階梯に載った円は「R/φ²」のように比で注記する
  const SUP = ['', '', '²', '³', '⁴', '⁵', '⁶', '⁷', '⁸'];
  const phiName = k => k === 0 ? 'R' : k === 1 ? 'R/φ' : 'R/φ' + (SUP[k] || k);
  const snapped = chosen.filter(f => f.phiK != null).slice(0, 5);
  const labelTargets = snapped.length >= 2 ? snapped : majors.slice(0, 3);
  labelTargets.forEach(f => {
    if (rng() < 0.9 * density) {
      const th = rng() * Math.PI * 2;
      const ex = f.cx + Math.cos(th) * f.r, ey = f.cy + Math.sin(th) * f.r;
      g.labels.push({
        line: `<line x1="${fmt(f.cx)}" y1="${fmt(f.cy)}" x2="${fmt(ex)}" y2="${fmt(ey)}"/>`,
        x: f.cx + Math.cos(th) * f.r * 0.55,
        y: f.cy + Math.sin(th) * f.r * 0.55,
        text: f.phiK != null ? phiName(f.phiK) : 'r ' + Math.round(f.r),
      });
    }
  });

  // φ階梯の凡例情報（シート側で描画）
  const usedKs = [...new Set(chosen.filter(f => f.phiK != null).map(f => f.phiK))].sort((a, b) => a - b);
  if (fits.Rbase && usedKs.length >= 2) {
    g.phi = { R: fits.Rbase, ks: usedKs.slice(0, 5), phiName };
  }

  return g;
}

/* ── 設計シートSVG（840×1050） ── */
const SHEET_W = 840, SHEET_H = 1050;

function wrapEn(str, max) {
  const words = String(str).split(/\s+/), lines = [];
  let cur = '';
  words.forEach(w => {
    if ((cur + ' ' + w).trim().length > max) { if (cur) lines.push(cur); cur = w; }
    else cur = (cur + ' ' + w).trim();
  });
  if (cur) lines.push(cur);
  return lines;
}
function wrapJa(str, max) {
  // 行頭禁則（。、」など）は前行へぶら下げ、末尾の孤立短行は直前行から字を移して整える
  const cs = Array.from(String(str));
  const noHead = '。、」』）］！？!?ー・';
  const lines = [];
  let cur = '';
  for (let i = 0; i < cs.length; i++) {
    cur += cs[i];
    if (cur.length >= max && !(i + 1 < cs.length && noHead.includes(cs[i + 1]))) {
      lines.push(cur); cur = '';
    }
  }
  if (cur) lines.push(cur);
  if (lines.length >= 2 && Array.from(lines[lines.length - 1]).length <= 3) {
    const prev = Array.from(lines[lines.length - 2]);
    lines[lines.length - 1] = prev.slice(-3).join('') + lines[lines.length - 1];
    lines[lines.length - 2] = prev.slice(0, -3).join('');
  }
  return lines;
}

/* 2色を混ぜる（シートの注記色をインク・紙から導出する） */
function mixHex(a, b, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16));
  const pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function inkRgba(ink, alpha) {
  const p = [1, 3, 5].map(i => parseInt(ink.slice(i, i + 2), 16));
  return `rgba(${p[0]},${p[1]},${p[2]},${alpha})`;
}

function sheetSVG(motif, opts) {
  const { ink, paper, seed, density, brand } = opts;
  // マーク配置: 512 → 620px 幅、中央
  const s = 620 / 512, tx = (SHEET_W - 620) / 2, ty = 132;
  const guides = buildGuides(motif, seed, density);
  const guideColor = mixHex(ink, paper, 0.5);
  const gridColor = inkRgba(ink, 0.13);
  const gridColor2 = inkRgba(ink, 0.22);
  const inkDim = mixHex(ink, paper, 0.36);
  const idHash = String(motif.id || '').split('').reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const sheetNo = String(1000 + ((seed + idHash) % 9000)).padStart(4, '0');

  const conceptEnAll = wrapEn(motif.concept || '', 72);
  const conceptEn = conceptEnAll.slice(0, 6);
  if (conceptEnAll.length > 6) conceptEn[5] += ' …';
  const conceptJaAll = wrapJa(motif.conceptJa || '', 31);
  const conceptJa = conceptJaAll.slice(0, 3);
  if (conceptJaAll.length > 3) conceptJa[2] += '…';
  let ty2 = 856;
  const enT = conceptEn.map(l => `<text x="64" y="${ty2 += 18}" font-size="12" fill="${inkDim}" font-family="Georgia,'Times New Roman',serif">${esc(l)}</text>`).join('');
  ty2 += 11;
  const jaT = conceptJa.map(l => `<text x="64" y="${ty2 += 16.5}" font-size="10.5" fill="${inkDim}" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">${esc(l)}</text>`).join('');

  // ブランド名の概算幅（fs17・字間2。和文は全角幅で見積もる）
  const brandWidth = Array.from(String(brand)).reduce((w, c) => w + (c.charCodeAt(0) > 255 ? 19 : 10.4), 0);

  const labels = guides.labels.map(l =>
    `<g stroke="${guideColor}" stroke-width="0.7" opacity="0.85">${l.line}</g>` +
    `<text x="${fmt(l.x)}" y="${fmt(l.y - 3)}" font-size="8.5" fill="${guideColor}" font-family="ui-monospace,Menlo,monospace" text-anchor="middle">${esc(l.text)}</text>`
  ).join('');

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${SHEET_W}" height="${SHEET_H}" viewBox="0 0 ${SHEET_W} ${SHEET_H}" role="img" aria-label="設計シート: ${esc(motif.nameJa || '')}">
  <defs>
    <pattern id="gridMinor" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 H 0 V 8" fill="none" stroke="${gridColor}" stroke-width="0.5"/>

    <pattern id="gridMajor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="${gridColor2}" stroke-width="0.5"/>
    </pattern>
    <clipPath id="sheetClip"><rect width="${SHEET_W}" height="${SHEET_H}"/></clipPath>
  </defs>
  <rect width="${SHEET_W}" height="${SHEET_H}" fill="${paper}"/>
  <rect width="${SHEET_W}" height="${SHEET_H}" fill="url(#gridMinor)"/>
  <rect width="${SHEET_W}" height="${SHEET_H}" fill="url(#gridMajor)"/>

  <!-- 目盛り（上端・左端） -->
  <g stroke="${inkDim}" stroke-width="0.5" opacity="0.45">
    ${Array.from({ length: SHEET_W / 40 - 1 }, (_, i) => `<line x1="${(i + 1) * 40}" y1="0" x2="${(i + 1) * 40}" y2="${(i + 1) % 2 ? 4 : 7}"/>`).join('')}
    ${Array.from({ length: SHEET_H / 40 - 1 }, (_, i) => `<line x1="0" y1="${(i + 1) * 40}" x2="${(i + 1) % 2 ? 4 : 7}" y2="${(i + 1) * 40}"/>`).join('')}
  </g>
  <g fill="${inkDim}" opacity="0.5" font-family="ui-monospace,Menlo,monospace" font-size="6" text-anchor="middle">
    ${Array.from({ length: SHEET_W / 80 - 1 }, (_, i) => `<text x="${(i + 1) * 80}" y="15">${(i + 1) * 80}</text>`).join('')}
  </g>

  <!-- 作図領域（テキスト類より先に描き、文字が線の上に載るようにする） -->
  <g clip-path="url(#sheetClip)">
    <g transform="translate(${tx},${ty}) scale(${s})">
      <g class="fade" opacity="0.22">${markBody(motif, ink, paper)}</g>
      <g fill="none" stroke="${guideColor}" stroke-width="0.6" opacity="0.66">
        ${guides.strokes.map(x => `<g class="guide">${x}</g>`).join('\n')}
      </g>
      <g stroke="${guideColor}" stroke-width="0.45" opacity="0.55">${guides.lines.map(x => `<g class="guide">${x}</g>`).join('\n')}</g>
      <g fill="none" stroke="${guideColor}" stroke-width="0.55" opacity="0.5" stroke-dasharray="4 4">${guides.dashed.join('\n')}</g>
      <path d="${guides.ticks.join(' ')}" stroke="${guideColor}" stroke-width="0.65" opacity="0.8" fill="none"/>
      ${labels}
    </g>
  </g>

  <!-- ヘッダ（ブランド名の実幅ぶんマークを左へ逃がす） -->
  <g>
    ${placedMark(motif, ink, paper, SHEET_W / 2 + 8 - brandWidth / 2 - 40, 40, 26)}
    <text x="${SHEET_W / 2 + 8}" y="59" font-size="17" letter-spacing="2" fill="${ink}" text-anchor="middle" font-family="Georgia,'Times New Roman','Hiragino Mincho ProN',serif">${esc(brand)}</text>
    <text x="${SHEET_W / 2}" y="82" font-size="7.5" letter-spacing="3.2" fill="${inkDim}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">GEOMETRIC LOGO CONSTRUCTION — SHEET No. ${sheetNo}</text>
  </g>

  <!-- φ階梯の凡例（黄金比が構造として使われている証明） -->
  ${guides.phi ? `<g>
    <rect x="52" y="112" width="118" height="${26 + guides.phi.ks.length * 15}" fill="${paper}" opacity="0.55"/>
    <text x="64" y="130" font-size="7.5" letter-spacing="2.5" fill="${ink}" font-family="ui-monospace,Menlo,monospace">GOLDEN LADDER φ</text>
    ${guides.phi.ks.map((k, i) =>
      `<text x="64" y="${147 + i * 15}" font-size="8.5" fill="${inkDim}" font-family="ui-monospace,Menlo,monospace">${guides.phi.phiName(k)} = ${Math.round(guides.phi.R / Math.pow(PHI, k))}</text>`
    ).join('')}
  </g>` : ''}

  <!-- CONCEPT（うっすら紙色を敷き、補助線の上でも読めるようにする） -->
  <rect x="50" y="832" width="546" height="196" fill="${paper}" opacity="0.6"/>
  <text x="64" y="850" font-size="10" letter-spacing="4.5" fill="${ink}" font-family="ui-monospace,Menlo,monospace">CONCEPT</text>
  ${enT}
  ${jaT}

  <!-- 完成マークの窓 -->
  <g>
    <rect x="602" y="822" width="176" height="176" fill="${paper}" stroke="${inkDim}" stroke-width="0.8"/>
    ${placedMark(motif, ink, paper, 626, 846, 128)}
  </g>
  <text x="690" y="1014" font-size="7.5" letter-spacing="2.5" fill="${inkDim}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">FINAL MARK 1:4.8</text>

  <!-- 朱印 -->
  <g transform="translate(64,64)">
    <rect x="0" y="0" width="30" height="30" rx="2" fill="#b5493a" opacity="0.92"/>
    <text x="15" y="10.5" font-size="9.5" fill="#f4f2ea" text-anchor="middle" dominant-baseline="middle" font-family="'Hiragino Mincho ProN','Yu Mincho',serif">円</text>
    <text x="15" y="21.5" font-size="9.5" fill="#f4f2ea" text-anchor="middle" dominant-baseline="middle" font-family="'Hiragino Mincho ProN','Yu Mincho',serif">相</text>
  </g>
</svg>`;
}

/* ── 完成ロゴカードSVG ── */
function logoSVG(motif, opts) {
  const { ink, paper } = opts;
  const size = 460, x = (SHEET_W - size) / 2, y = (SHEET_H - size) / 2 - 30;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${SHEET_W}" height="${SHEET_H}" viewBox="0 0 ${SHEET_W} ${SHEET_H}" role="img" aria-label="完成ロゴ: ${esc(motif.nameJa || '')}">
  <rect width="${SHEET_W}" height="${SHEET_H}" fill="${paper}"/>

}

/* ── モノグラム生成（円相＝欠けた円環＋頭文字） ──
   円弧は3次ベジェ近似で出力する（パーサ・フィッタが M/L/C/Q/Z のみ対応のため） */
function arcCubics(cx, cy, r, a0, a1) {
  // a0→a1 の円弧を90°以下の C セグメント列で返す（先頭のM無し）
  const segs = Math.max(1, Math.ceil(Math.abs(a1 - a0) / (Math.PI / 2)));
  const da = (a1 - a0) / segs;
  const k = 4 / 3 * Math.tan(da / 4);
  let out = '';
  for (let s = 0; s < segs; s++) {
    const t0 = a0 + s * da, t1 = t0 + da;
    const x0 = cx + r * Math.cos(t0), y0 = cy + r * Math.sin(t0);
    const x1 = cx + r * Math.cos(t1), y1 = cy + r * Math.sin(t1);
    out += ` C ${fmt(x0 - k * r * Math.sin(t0))} ${fmt(y0 + k * r * Math.cos(t0))}`
        + ` ${fmt(x1 + k * r * Math.sin(t1))} ${fmt(y1 - k * r * Math.cos(t1))}`
        + ` ${fmt(x1)} ${fmt(y1)}`;
  }
  return out;
}
function annularArc(cx, cy, rOut, rIn, a0, a1) {
  const sx = cx + rOut * Math.cos(a0), sy = cy + rOut * Math.sin(a0);
  const ix = cx + rIn * Math.cos(a1), iy = cy + rIn * Math.sin(a1);
  return `M ${fmt(sx)} ${fmt(sy)}${arcCubics(cx, cy, rOut, a0, a1)}`
    + ` L ${fmt(ix)} ${fmt(iy)}${arcCubics(cx, cy, rIn, a1, a0)} Z`;
}
function monogramMotif(brand, seed) {
  // Array.from でコードポイント単位に切る（絵文字・非BMP漢字でサロゲートを割らない）
  const ch = (Array.from(String(brand).trim())[0] || 'E').toUpperCase();
  const rng = mulberry32(seed);
  const gapAt = -Math.PI / 2 + (rng() - 0.3) * 1.2;       // 円環の切れ目位置
  const gap = 0.55 + rng() * 0.4;
  const a0 = gapAt + gap / 2, a1 = gapAt + Math.PI * 2 - gap / 2;
  return {
    id: 'monogram', nameEn: 'Monogram', nameJa: 'モノグラム',
    concept: `A single brushed ring opens at one point, leaving room for the initial "${ch}" to breathe at its center. The incomplete circle borrows the ensō gesture: a mark of intention, finished by the eye of the viewer.`,
    conceptJa: `一箇所だけ開いた円環の中心に、頭文字「${ch}」を据えたモノグラム。見る者の目が円を完成させる、円相の所作を借りた印。`,
    paths: [{ d: annularArc(256, 256, 208, 186, a0, a1), op: 'add' }],
    texts: [{ ch, x: 256, y: 268, size: 176 }],
  };
}

/* ── 抽象マーク生成（黄金角スパイラル上の円の集積） ── */
function abstractMotif(seed) {
  const rng = mulberry32(seed);
  const circles = [];
  const n = 8 + Math.floor(rng() * 4);
  let cx = 256, cy = 262, r = 96 + rng() * 26;
  const golden = Math.PI * (3 - Math.sqrt(5));
  let a = rng() * Math.PI * 2;
  circles.push({ cx, cy, r, op: 'add' });
  let px = cx, py = cy, pr = r;
  for (let i = 1; i < n; i++) {
    a += golden;
    const nr = Math.max(22, pr / (1.12 + rng() * 0.28));
    const d = (pr + nr) * (0.52 + rng() * 0.22);
    const nx = px + Math.cos(a) * d, ny = py + Math.sin(a) * d;
    const op = i > 2 && rng() < 0.25 && nr < pr * 0.75 ? 'cut' : 'add';
    circles.push({ cx: fmt(nx), cy: fmt(ny), r: fmt(nr), op });
    if (op === 'add') { px = nx; py = ny; pr = nr; }
  }
  // cut が一度も出なかったら1つ彫り、必ず表情を作る
  if (!circles.some(s => s.op === 'cut')) {
    circles.push({ cx: fmt(cx + r * 0.55), cy: fmt(cy - r * 0.45), r: fmt(r * 0.34), op: 'cut' });
  }
  // 光学センタリング: add円のバウンディングボックス中心を (256,262) へ寄せる
  const adds = circles.filter(s => s.op === 'add');
  const minX = Math.min(...adds.map(s => s.cx - s.r)), maxX = Math.max(...adds.map(s => s.cx + s.r));
  const minY = Math.min(...adds.map(s => s.cy - s.r)), maxY = Math.max(...adds.map(s => s.cy + s.r));
  const dx = 256 - (minX + maxX) / 2, dy = 262 - (minY + maxY) / 2;
  circles.forEach(s => { s.cx = fmt(s.cx + dx); s.cy = fmt(s.cy + dy); });
  return {
    id: 'abstract', nameEn: 'Abstract', nameJa: '抽象',
    concept: 'Circles descend along the golden angle, each borrowing its radius from the last, until a single asymmetric constellation remains. The mark is pure construction: nothing depicted, everything derived.',
    conceptJa: '黄金角に沿って円が連なり、ひとつの非対称な星座として結晶する。何も描かず、すべてが作図から導かれた印。',
    circles,
  };
}

/* ── 現在のモチーフを解決 ── */
function currentMotif() {
  if (state.motif === 'monogram') return monogramMotif(state.brand, state.seed);
  if (state.motif === 'abstract') return abstractMotif(state.seed);
  return MOTIFS.find(m => m.id === state.motif) || MOTIFS[0] || abstractMotif(state.seed);
}

/* ── 描画 ── */
let lastSheetSVG = '', lastLogoSVG = '';
function render(animate) {
  const motif = currentMotif();
  const opts = { ink: state.ink, paper: state.paper, seed: state.seed, density: state.density, brand: state.brand };
  lastSheetSVG = sheetSVG(motif, opts);
  lastLogoSVG = logoSVG(motif, opts);
  const sheetCard = document.getElementById('sheetCard');
  const logoCard = document.getElementById('logoCard');
  sheetCard.innerHTML = lastSheetSVG;
  logoCard.innerHTML = lastLogoSVG;

  const status = document.getElementById('renderStatus');
  if (status) status.textContent = `設計シートを更新: ${motif.nameJa || motif.id}`;

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // モバイル縦積みでは結果が画面外に出るので、生成時にシートへ追従する
  if (animate && matchMedia('(max-width: 900px)').matches) {
    sheetCard.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
  }
  if (animate && !reduced) {
    // 補助線を描画順にストロークで引き、終わり際にシルエットを現す
    sheetCard.classList.add('drawing');
    const guides = sheetCard.querySelectorAll('.guide > *');
    const fades = [...sheetCard.querySelectorAll('.fade'), ...logoCard.querySelectorAll('.fade')];
    fades.forEach(el => { el.style.opacity = '0'; });
    guides.forEach((el, i) => {
      let len = 600;
      try { if (el.getTotalLength) len = el.getTotalLength(); } catch (e) {}
      if (!isFinite(len) || len <= 0) len = 600;
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
      el.style.transitionDelay = (i * 16) + 'ms';
    });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      guides.forEach(el => { el.style.strokeDashoffset = '0'; });
      setTimeout(() => {
        // style.opacity を外し、SVG属性の opacity（sheet側0.16 / logo側1）へ遷移で戻す
        fades.forEach(el => { el.style.opacity = ''; });
      }, Math.min(1300, guides.length * 16 + 450));
    }));
  }
}

/* ── ダウンロード ──
   claude.ai Artifact ビューア内では window.claude.downloads 経由で保存を提案し、
   通常のブラウザ（file:// 含む）ではアンカー要素で直接保存する */
function download(name, blob) {
  if (window.claude && window.claude.downloads) {
    window.claude.downloads.save({ filename: name, data: blob }).catch(e => {
      const code = e && e.code;
      if (code === 'declined') return;                     // 利用者が断った: 何もしない
      if (code === 'extension_not_enabled') {
        alert('この環境ではSVG形式の保存が許可されていません。PNGをご利用ください。');
      } else if (code === 'rate_limited') {
        alert('保存の確認が開いています。少し待ってからもう一度お試しください。');
      }
      // unavailable 等はここでは通知しない（保存UI自体は他環境で有効）
    });
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function fileBase(target) {
  const b = state.brand.replace(/[^\p{L}\p{N}_\-]/gu, '') || 'enso';
  return `${b}-${state.motif}-${target}`;
}
function downloadSVG(target) {
  const src = target === 'sheet' ? lastSheetSVG : lastLogoSVG;
  download(fileBase(target) + '.svg', new Blob([src], { type: 'image/svg+xml' }));
}
function downloadPNG(target) {
  let src = target === 'sheet' ? lastSheetSVG : lastLogoSVG;
  if (src.toWellFormed) src = src.toWellFormed();   // 迷子サロゲートで encodeURIComponent が落ちないよう保険
  const img = new Image();
  const scale = 2;
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = SHEET_W * scale; cv.height = SHEET_H * scale;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    try {
      cv.toBlob(b => { if (b) download(fileBase(target) + '.png', b); else downloadSVG(target); }, 'image/png');
    } catch (e) { downloadSVG(target); }
  };
  img.onerror = () => downloadSVG(target);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
}

/* ── UI構築 ── */
function buildUI() {
  const grid = document.getElementById('motifGrid');
  MOTIFS.forEach(m => {
    const b = document.createElement('button');
    b.className = 'motif-btn'; b.type = 'button'; b.dataset.motif = m.id;
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = markSVG(m, 'currentColor', 'var(--thumb-bg)', 40) + `<span class="mname">${esc(m.nameJa)}</span>`;
    grid.appendChild(b);
  });
  const mono = document.createElement('button');
  mono.className = 'motif-btn'; mono.type = 'button'; mono.dataset.motif = 'monogram';
  mono.setAttribute('aria-pressed', 'false');
  mono.innerHTML = `<span class="big">E</span><span class="mname">頭文字</span>`;
  grid.appendChild(mono);
  const abs = document.createElement('button');
  abs.className = 'motif-btn'; abs.type = 'button'; abs.dataset.motif = 'abstract';
  abs.setAttribute('aria-pressed', 'false');
  abs.innerHTML = `<span class="big">◐</span><span class="mname">抽象</span>`;
  grid.appendChild(abs);

  grid.addEventListener('click', e => {
    const btn = e.target.closest('.motif-btn');
    if (!btn) return;
    state.motif = btn.dataset.motif;
    grid.querySelectorAll('.motif-btn').forEach(x => {
      x.classList.toggle('active', x === btn);
      x.setAttribute('aria-pressed', x === btn ? 'true' : 'false');
    });
    render(true);
  });

  const makeSwatchRow = (rowId, list, apply) => {
    const row = document.getElementById(rowId);
    list.forEach((k, i) => {
      const b = document.createElement('button');
      b.className = 'swatch' + (i === 0 ? ' active' : ''); b.type = 'button';
      b.style.background = k.c; b.title = k.name; b.setAttribute('aria-label', k.name);
      b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
      b.onclick = () => {
        apply(k.c);
        row.querySelectorAll('.swatch').forEach(x => {
          x.classList.toggle('active', x === b);
          x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
        });
        render(false);
      };
      row.appendChild(b);
    });
  };
  makeSwatchRow('inkSwatches', INKS, c => { state.ink = c; });
  makeSwatchRow('paperSwatches', PAPERS, c => { state.paper = c; });

  document.getElementById('brandName').addEventListener('input', e => {
    state.brand = e.target.value.trim() || 'Ensō';
    const tile = document.querySelector('.motif-btn[data-motif="monogram"] .big');
    if (tile) tile.textContent = (Array.from(state.brand)[0] || 'E').toUpperCase();
    render(false);
  });
  const density = document.getElementById('density');
  density.setAttribute('aria-valuetext', density.value + '%');
  density.addEventListener('input', e => {
    state.density = e.target.value / 100;
    e.target.setAttribute('aria-valuetext', e.target.value + '%');
    render(false);
  });
  document.getElementById('genBtn').addEventListener('click', () => {
    state.seed = Math.floor(Math.random() * 1e9);
    render(true);
  });
  document.querySelectorAll('[data-dl]').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.dl === 'svg') downloadSVG(b.dataset.target);
      else downloadPNG(b.dataset.target);
    });
  });
}

/* ── 起動（URLパラメータ: ?motif=lion&brand=X&seed=123 で直接指定可） ── */
buildUI();
const qs = new URLSearchParams(location.search);
const qMotif = qs.get('motif');
const validMotif = qMotif && (qMotif === 'monogram' || qMotif === 'abstract' || MOTIFS.some(m => m.id === qMotif));
state.motif = validMotif ? qMotif : (MOTIFS[0] ? MOTIFS[0].id : 'abstract');
const qBrand = (qs.get('brand') || '').trim();
if (qBrand) {
  state.brand = Array.from(qBrand).slice(0, 24).join('');   // コードポイント単位で切る
  document.getElementById('brandName').value = state.brand;
  const tile = document.querySelector('.motif-btn[data-motif="monogram"] .big');
  if (tile) tile.textContent = (Array.from(state.brand)[0] || 'E').toUpperCase();
}
const qSeed = qs.get('seed');
if (qSeed !== null && /^\d+$/.test(qSeed)) state.seed = Number(qSeed) >>> 0;   // seed=0 も有効
const first = document.querySelector(`.motif-btn[data-motif="${state.motif}"]`);
if (first) first.classList.add('active');
render(true);
</script>
</body>
</html>
