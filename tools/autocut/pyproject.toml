[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocut"
version = "0.1.0"
description = "撮った動画1本から YouTube ロング / ショート / TikTok をテロップ付きで自動生成する"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]

[project.scripts]
autocut = "autocut.cli:main"

[tool.setuptools]
packages = ["autocut"]
